rankup:
  enabled: true
  require-sequential: true
  # true = VIP2 lên VIP3 sẽ giữ buff VIP2 và cộng thêm buff VIP3.
  # false = chỉ giữ buff của rank mới nhất.
  stack-bonuses: true
  # Alias cũ để tương thích config đã tạo trước đó.
  preserve-current-rank-perks: true

  broadcast:
    enabled: true
    # true = lấy format mặc định từ plugins/TurtleBroadcast/config.yml nếu file tồn tại.
    use-turtlebroadcast-format: true
    # Để trống sẽ tự dùng plugins/TurtleBroadcast/config.yml.
    # Có thể set đường dẫn riêng, ví dụ: "TurtleBroadcast/config.yml" hoặc đường dẫn absolute.
    turtlebroadcast-config: ""
    # -1 = dùng line-delay-ticks của TurtleBroadcast/default.
    line-delay-ticks: -1
    # Để rỗng từng dòng thì sẽ dùng format của TurtleBroadcast.
    # Format hỗ trợ {message}, {line-icon}, {first-line-icon}, {chained-line-icon}.
    format:
      first-line-icon: ""
      chained-line-icon: ""
      first-line: ""
      chained-line: ""
    messages:
      - "&6&lRANKUP &8» &f{player} &ađã nâng lên {rank}&a!"
      - "&7Tu Vi: &a+{total_tuvi}% &8| &7Khí vận: &d+{total_forge_luck} &8| &7Tiền quái: &6+{total_mythic_money}%"

  playerpoints:
    enabled: true
    currency-name: "Cổ thạch"

  luckperms:
    enabled: true
    required: true
    set-group-command: "lp user {player} parent set {group}"
    permission-command: "lp user {player} permission set {permission} true"
    permission-unset-command: "lp user {player} permission unset {permission}"

  messages:
    only-player: "&cChỉ player mới dùng được lệnh này."
    disabled: "&cRankup đang tắt."
    no-permission: "&cBạn không có quyền dùng /rankup."
    usage: "&e/rankup [vip1-vip10]"
    rank-not-found: "&cKhông tìm thấy rank: &e{rank}"
    already-or-lower: "&cBạn đã đạt rank này hoặc cao hơn rồi."
    max-rank: "&cBạn đã đạt rank tối đa."
    must-rankup-next: "&cBạn phải nâng lần lượt. Rank kế tiếp của bạn là &e{next}&c."
    playerpoints-missing: "&cKhông tìm thấy PlayerPoints."
    luckperms-missing: "&cKhông tìm thấy LuckPerms để set group."
    not-enough-points: "&cBạn cần &e{cost} {currency}&c. Hiện có: &e{balance}&c."
    take-points-failed: "&cKhông thể trừ {currency}, vui lòng thử lại."
    success:
      - "&6&lRANKUP &8» &aBạn đã lên &f{rank}&a!"
      - "&7Đã trừ: &e{cost} {currency}"
      - "&7Chế độ buff: &f{bonus_mode}"
      - "&7Buff Tu Vi: &a+{total_tuvi}%"
      - "&7Khí vận Luyện Khí: &d+{total_forge_luck}"
      - "&7Bonus tiền MythicMobs: &6+{total_mythic_money}%"

