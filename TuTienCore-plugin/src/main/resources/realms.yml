# ==========================================
# Cài đặt Đột Phá chung
# ==========================================
# Mỗi cảnh giới có thể override riêng tại:
#   realms.<id>.breakthrough.lightning-bolts
#   realms.<id>.breakthrough.damage-per-bolt
# Nếu không set → dùng giá trị mặc định bên dưới.
breakthrough:
  # ── SỐ TIA SÉT MẶC ĐỊNH ──
  # Số tia sét đánh (gây damage) trong quá trình đột phá
  # Có thể override per-realm trong mỗi cảnh giới ở trên
  default-lightning-bolts: 15
  # Damage mỗi tia sét mặc định (❤)
  default-damage-per-bolt: 4.0
  # Khoảng cách giữa mỗi tia sét (ticks, 20 ticks = 1 giây)
  lightning-interval-ticks: 50
  # Cooldown sau khi thất bại (giây, 1800 = 30 phút)
  cooldown-seconds: 1800
  weather-radius: 50
  sub-realm-broadcast-radius: 30
  dan-loss-percent: 50
  fail-damage-multiplier: 2.0
  fail-demote: true
  fail-demote-min-realm: 1
  dot-pha-dan-item: "DOT_PHA_DAN"
  dot-pha-dan-amounts:
    2: 1
    3: 1
    4: 2
    5: 2
    6: 3
    7: 3
    8: 4
    9: 4
    10: 5
    11: 5
    12: 6
    13: 6
    14: 7
    15: 7
    16: 8
    17: 8
    18: 9
    19: 10