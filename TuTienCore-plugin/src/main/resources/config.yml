# TuTienCore Configuration
# Plugin version: 1.0.0

debug: false

# Settings for the default action bar
action-bar:

  # Whether or not to use the default action bar.
  # (This doesn't change any other action bars provided by MMOCore.)
  enabled: true

  # The amount of ticks the bar will be
  # faded out when displaying other action bars.
  time-out: 60

  # The amount of ticks before updating the info
  ticks-to-update: 5

  # How to display the data.
  format: '&f༺ <#f03e5c>❤ {health}/{max_health} &f| <#82cfe8>〄 Linh Lực %TuTienClass_mana_left%/%TuTienClass_max_mana% &f༻'

  # Hien EXP vua nhan tu TuTienLevel ben canh action bar cua TuTienCore.
  exp-gain:
    enabled: true
    # Thoi gian hien sau moi lan nhan EXP (ticks).
    duration-ticks: 40
    # Placeholder: {exp}, {exp_formatted}, {source}, {mob}
    format: " &8| &a+{exp_formatted} EXP"
    # Mac dinh chi hien EXP kill MythicMob/quai tu TuTienLevel.
    # De [] neu muon hien moi nguon EXP TuTienLevel (api, command, ...).
    source-prefixes:
      - "MythicMob:"
  # Hien Linh Thach vua nhan tu MythicMobs money drop ben canh action bar.
  money-gain:
    enabled: false
    # Thoi gian hien sau moi lan nhan money (ticks).
    duration-ticks: 40
    # {money} la tong money cuoi cung sau bonus rank.
    # Placeholder: {money}, {money_formatted}, {base_money}, {base_money_formatted},
    # {bonus_money}, {bonus_money_formatted}, {bonus_percent}, {source}, {mob}
    format: " &8| &6+{money_formatted} Linh Thạch"

# Configurable command aliases.
# Set aliases: [] to disable aliases for a command.
commands:
  ttc:
    aliases: []
  tuluyen:
    aliases: [tl]
  dotpha:
    aliases: [dp]
  canhgioi:
    aliases: [realm]
  tuvi:
    aliases: []
  thauthi:
    aliases: []

# /thauthi: bật Thấu Thị để soi thông tin player đang nhìn.
# TextDisplay được ẩn mặc định và chỉ show cho người đang bật thấu thị.
thauthi:
  enabled: true
  permission: "tutiencore.thauthi"
  require-permission-each-tick: true
  max-distance: 18.0
  ray-size: 0.35
  require-line-of-sight: true
  ignore-spectator: true
  update-interval-ticks: 2
  y-offset: 0.75
  # offset-relative-to-viewer=true:
  # x-offset am = ben trai man hinh nguoi soi, duong = ben phai.
  # z-offset am = gan nguoi soi hon, duong = xa nguoi soi hon.
  x-offset: -0.95
  z-offset: 0.0
  offset-relative-to-viewer: true
  scale:
    default: 1.0
    distance-based: true
    # Cang lai gan target, text cang nho lai.
    min-distance: 1.5
    max-distance: 10.0
    min: 0.62
    max: 1.0
  teleport-duration: 3
  interpolation-duration: 3
  interpolation-delay: 0
  fade-out-ticks: 8
  fade-out-interpolation-duration: 4
  fade-out-opacity: 0
  opacity: 230
  view-range: 24.0
  line-width: 190
  shadow: true
  see-through: false
  default-background: false
  level-unavailable: "N/A"
  background-color:
    a: 0
    r: 0
    g: 0
    b: 0
  lines:
    - "&6&lThấu Thị &8» &f{target}"
    - "&7Cảnh giới: &e{realm_full}"
    - "&7Level: &a{level} &8| &7Tu Vi: &b{tuvi_compact}"
  messages:
    only-player: "&cChỉ player mới dùng được lệnh này."
    disabled: "&cThấu thị đang tắt."
    no-permission: "&cBạn không có quyền dùng Thấu Thị."
    on: "&aĐã bật Thấu Thị. Nhìn vào player để soi thông tin."
    off: "&cĐã tắt Thấu Thị."

mythicmobs-money-bonus:
  enabled: true
  # Ap dung cho money drop native cua MythicMobs, vi du: "- money 100-300 1".
  # Permission dang: tutiencore.mythicmoney.bonus.<phan_tram>
  permission-prefix: "tutiencore.mythicmoney.bonus."
  # true = cong tat ca permission bonus tien cua player.
  # false = chi lay permission bonus cao nhat.
  stack: true
  debug: false

# Hologram fade khi kill quai, giong popup EXP cua TuTienLevel.
# Text hien tai dung money sau khi da cong bonus rank/VIP.
kill-reward-hologram:
  enabled: true
  y-offset: 1.35
  x-offset: 0.0
  z-offset: 0.0
  random-xz-radius: 0.25
  rise: 0.8
  duration-ticks: 35
  start-opacity: 255
  end-opacity: 0
  shadow: true
  see-through: true
  line-width: 160
  money:
    enabled: true
    # Placeholder: %money%, %money_formatted%, %base_money%, %bonus_money%, %bonus_percent%, %mob%, %player%
    text: "&6+%money_formatted% Linh Thạch"

player-hologram:
  enabled: true
  # Hides the vanilla player nameplate by packet team data and uses a fake packet TextDisplay passenger above the player.
  hide-vanilla-name: true
  # true = if Nexo is installed, skip ttc_hide_names team packets to avoid packet transformer errors.
  disable-name-team-packets-when-nexo: true
  # Hide this player nametag while the /tuluyen FancyHolograms hologram is active.
  hide-while-tuluyen-hologram: true
  # Hide this player's info hologram while they are in spectator mode.
  hide-while-spectator: true
  # Show the hologram to its owner too. false = only other players see it.
  show-self: false
  # Final height above player feet. Tune this if hats/models overlap.
  y-offset: 2.55
  # Client passenger anchor for a standing player. y-offset - passenger-base-offset becomes the TextDisplay translation.
  passenger-base-offset: 1.35
  update-interval: 5
  teleport-duration: 2
  view-range: 32.0
  scale: 1.0
  spawn-animation:
    enabled: true
    start-scale: 0.82
    start-opacity: 40
    interpolation-duration: 1
    start-delay-ticks: 1
  line-width: 200
  text-shadow: true
  see-through: false
  default-background: false
  background-color:
    a: 0
    r: 0
    g: 0
    b: 0
  # Supports TuTien placeholders below and PlaceholderAPI placeholders.
  # Built-in: {player}, {display_name}, {health}, {health_int}, {max_health}, {max_health_int},
  # {tuvi}, {tuvi_int}, {tuvi_formatted}, {tuvi_compact}, {next_tuvi}, {next_tuvi_int},
  # {next_tuvi_formatted}, {next_tuvi_compact}, {realm}, {realm_full}, {sub_realm}, {realm_tier}, {world}
  lines:
    - "&8[&6*&8] &f{player}"
    - "&7{realm_full}"
    - "&fTu Vi: &a{tuvi_compact}"

tu-luyen:
  # Thoi gian (tick) de nhan Tu Vi (20 ticks = 1 giay)
  interval: 100
  # Khoang cach toi da tu cuc linh khi (blocks) de co the /tuluyen
  max-distance: 10.0
  # Diem Tu Vi nhan duoc moi lan.
  points-per-interval: 10
  # true = cong tat ca permission tutiencore.tuvi.bonus.* cua player.
  # false = chi lay permission bonus cao nhat.
  permission-bonus:
    stack: true
  # Command de cho diem Tu Vi, su dung %player% cho ten, va %points% cho so luong
  give-command: "eco give %player% %points%"
  # Ti le Thien Loi ao danh xuong khi nhan Tu Vi. Neu trung, diem Tu Vi lan do duoc nhan multiplier.
  # strikeLightningEffect chi hien hieu ung/sound, khong gay sat thuong va khong tao lua.
  lightning-bonus:
    enabled: true
    chance-percent: 20.0
    multiplier: 2.0
  sounds:
    interval-reset:
      enabled: true
      # Ho tro ca Bukkit Sound enum va custom sound tu resource pack.
      # Vi du: ENTITY_EXPERIENCE_ORB_PICKUP hoac yourpack:tu_luyen_cycle
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      category: MASTER
      volume: 1.0
      pitch: 1.15
  bossbar:
    enabled: false
    color: BLUE
    style: SEGMENTED_10
    title: "&bTu Vi sắp nhận: &e{base} &7+ &aBonus {bonus}% &7+ &dMôi Trường {environment}% &7= &6{total}"
  hologram:
    enabled: true
    # Requires FancyHolograms. Hologram is created when /tuluyen starts and removed when it stops.
    y-offset: 2.4
    scale: 1.0
    spawn-animation:
      enabled: true
      start-scale: 0.82
      start-opacity: 40
      interpolation-duration: 1
      start-delay-ticks: 1
    visibility-distance: 32
    update-interval: 20
    text-shadow: true
    see-through: false
    # Placeholders: {bonus}=quyen+Tien Phu, {infusion}=Lua Than, {total_bonus}=bonus+Lua Than, {all_bonus}=total_bonus+moi truong.
    lines:
      - "&eTrạng thái: &aBế quan tu luyện"
      - ""
      - "&fCơ bản: &b+{base}"
      - ""
      - "&aBonus: &a+{total_bonus}%"
      - "&5Lửa Thần: &d+{infusion}%"
      - "&dMôi Trường Tu Luyện: &d+{environment}%"
      - "&6Tu Vi Thực Nhận: &6+{total}"
    team-bonus:
      enabled: true
      # Hien khi BetterteamsAddon bao player co dong doi cung /tuluyen trong pham vi.
      # Placeholder: {team_bonus}, {team_multiplier}
      lines:
        - "&aTông môn: &f+{team_bonus}%"
  environment-bonus:
    worlds: {}
    regions: {}

offline-tuluyen:
  # Player có permission này nhận 100% Tu Vi offline.
  # Player thường vẫn được tích Tu Vi offline, nhưng chỉ nhận theo default-multiplier.
  permission: "tutiencore.tuluyen.vip"
  # Offline reward dung points-per-interval ben tren, nhung moi 60 giay offline moi tinh 1 lan.
  interval-seconds: 60
  # 0.5 = player thường nhận 50% Tu Vi offline.
  default-multiplier: 0.5
  # 1.0 = player có permission bên trên nhận 100% Tu Vi offline.
  permission-multiplier: 1.0
  # Giới hạn thời gian offline được cộng Tu Vi. 0 = không giới hạn.
  max-offline-hours: 8
  open-gui:
    # true = đợi resource pack load xong mới mở GUI nhận Tu Vi offline.
    after-resourcepack: true
    # Chỉ mở GUI nếu lần offline vừa rồi lâu hơn số giây này.
    min-offline-seconds: 60
    # Nếu không đợi resource pack, mở GUI sau delay này.
    delay-ticks: 20
    # Nếu server/client không gửi trạng thái resource pack, tự mở sau delay này để khỏi kẹt.
    fallback-delay-ticks: 300
  # Chi phi PlayerPoints khi claim x2.
  claim-x2-cost: 100
  claim-x2:
    # true = player phai co permission thue thang moi duoc bam nhan x2.
    # Vi du LuckPerms thue 30 ngay:
    # /lp user <player> permission settemp tutiencore.tuluyen.offline.x2 true 30d
    require-permission: true
    permission: "tutiencore.tuluyen.offline.x2"

# Kick người chơi AFK theo rank VIP.
# Plugin lấy rank cao nhất mà player có permission theo dạng:
#   tutiencore.vip.0, tutiencore.vip.1, tutiencore.vip.2...
# VIP 0 là rank mặc định cho mọi người chơi nếu không có permission VIP cao hơn.
afk-kick:
  enabled: true
  permission-prefix: "tutiencore.vip."
  bypass-permission: "tutiencore.afk.bypass"
  default-rank: 0
  check-interval: 1s
  # Đứng yên/không đánh/không click trong thời gian này mới bắt đầu bị tính AFK.
  afk-start-after: 10s
  kick-message: "&cBạn đã AFK quá lâu. Hãy quay lại khi sẵn sàng tiếp tục tu luyện."
  title:
    enabled: true
    title: "&6&lĐang AFK"
    subtitle: "&eCòn &c%time% &enữa sẽ bị rời khỏi máy chủ."
    fade-in: 5
    stay: 45
    fade-out: 10
    repeat-interval: 10s
  warning:
    enabled: true
    before-kick: 30s
    message: "&eBạn đang AFK quá lâu. Còn &c%time% &enữa sẽ bị rời khỏi máy chủ."
  activity:
    # true = chỉ xoay camera không tính là hoạt động, phải di chuyển/chat/click/chạy lệnh.
    ignore-look-only: true
    movement-threshold: 0.08
  ranks:
    0:
      permission: ""
      kick-after: 10m
    1:
      permission: "tutiencore.vip.1"
      kick-after: 30m
    2:
      permission: "tutiencore.vip.2"
      kick-after: 1h
    3:
      permission: "tutiencore.vip.3"
      kick-after: 2h
    4:
      permission: "tutiencore.vip.4"
      kick-after: never
    5:
      permission: "tutiencore.vip.5"
      kick-after: never

# ==========================================
# PERMISSIONS
# ==========================================
# tutiencore.use               - Cho phep /tuluyen va /dotpha (default: true)
# tutiencore.admin             - Quyen admin: /canhgioi, /tuvi (default: op)
# tutiencore.tuluyen.vip       - Tich Tu Vi offline va mo GUI claim khi vao lai server
#
# Tu Vi Bonus (buff diem thu thap Tu Vi khi tu luyen):
#   tutiencore.tuvi.bonus.<phan_tram>
#   VD:
#     tutiencore.tuvi.bonus.20   → +20% Tu Vi (10 diem → 12 diem)
#     tutiencore.tuvi.bonus.50   → +50% Tu Vi (10 diem → 15 diem)
#     tutiencore.tuvi.bonus.100  → +100% Tu Vi (10 diem → 20 diem)
#
#   Mac dinh tu-luyen.permission-bonus.stack: true se CONG DON tat ca gia tri hop le.
#   VD: co tutiencore.tuvi.bonus.30 va tutiencore.tuvi.bonus.50 → +80% Tu Vi.
#   Neu stack: false thi chi lay permission cao nhat → +50% Tu Vi.
#
#   LuckPerms setup:
#     /lp group vip permission set tutiencore.tuvi.bonus.20
#     /lp group svip permission set tutiencore.tuvi.bonus.50
#     /lp group mvp permission set tutiencore.tuvi.bonus.100
#
# MythicMobs Money Bonus:
#   tutiencore.mythicmoney.bonus.<phan_tram>
#   Ap dung cho drop MythicMobs dang "- money 100-300 1".
#   VD: mob drop 300, player co tutiencore.mythicmoney.bonus.20 -> nhan them 60.
#   mythicmobs-money-bonus.stack: true se cong don nhieu permission, false chi lay cao nhat.

# ==========================================
# PLACEHOLDERS
# ==========================================
# Ban co the su dung cac Placeholder thong qua PlaceholderAPI:
# 
# Thong tin ca nhan (Single Player):
# %tutien_tuvi%            - Tu Vi nguyen goc (VD: 15.5)
# %tutien_tuvi_int%        - Tu Vi so nguyen (VD: 15)
# %tutien_tuvi_formatted%  - Tu Vi co dau phay (VD: 1,500)
# %tutien_tuvi_compact%    - Tu Vi dang gon (VD: 1.5k, 2M)
# 
# Canh Gioi (Realm):
# %tutien_canhgioi_full%   - ★ CHINH: display-name tu realms.yml (VD: §a「Luyen Khi」)
# %tutien_canhgioi%        - Ten khong mau (VD: Luyen Khi)
# %tutien_canhgioi_id%     - So thu tu (VD: 2)
# %tutien_canhgioi_tang%   - Tang nho hien tai (VD: Dinh Phong)
# %tutien_canhgioi_daigioi% - Dai gioi (VD: Pham Gioi)
# %tutien_canhgioi_english% - Ten tieng Anh (VD: Qi Refinement)
# %tutien_dotpha_cooldown% - Cooldown dot pha con lai (giay)
# %tutien_dotpha_ready%    - San sang dot pha? (true/false)
# %tutien_dotpha_next_tuvi_required% - Tu Vi can cho dot pha tiep theo
# 
# Thong tin bang xep hang (Leaderboard) (Noi X la vi tri hang):
# %tutien_top_name_X%            - Ten nguoi choi hang X (VD: %tutien_top_name_1%)
# %tutien_top_tuvi_X%            - Tu Vi cua hang X (So goc)
# %tutien_top_tuvi_int_X%        - Tu Vi cua hang X (So nguyen)
# %tutien_top_tuvi_formatted_X%  - Tu Vi cua hang X (Co dau phay)
# %tutien_top_tuvi_compact_X%    - Tu Vi cua hang X (Dang gon)
# ==========================================

placeholders:
  dotpha-ready:
    # Output cua %tutien_dotpha_ready% khi nguoi choi du dieu kien dot pha.
    ready-display-name: "V"
    # Output cua %tutien_dotpha_ready% khi nguoi choi chua du dieu kien dot pha.
    not-ready-display-name: "X"
  dotpha-next-tuvi-required:
    # Output cua %tutien_dotpha_next_tuvi_required%.
    # Placeholder ho tro: {value} = so Tu Vi can, da format dau phay.
    display-name: "{value}"

particles:
  sphere:
    # Co bat sphere particle khong
    enabled: true
    interval: 5
    radius: 1.0
    points: 100
    color:
      r: 66
      g: 245
      b: 227
  line:
    spacing: 0.2
    duration: 10
    color:
      r: 255
      g: 255
      b: 255

# ==========================================
# HIEU UNG TU LUYEN (Cultivation Effects)
# ==========================================
# Cau hinh hieu ung khi nguoi choi tu luyen
# Moi layer co the bat/tat rieng le
cultivation-effects:
  # Mau chu dao (Cyan/Xanh duong)
  primary-color:
    r: 0
    g: 220
    b: 255
  # Double Helix - Vong xoay nang luong quanh nguoi
  helix:
    enabled: true
  # Energy Burst - Tia nang luong ban ra tu tam
  rays:
    enabled: true
  # Lightning Arcs - Set dien quanh nguoi
  lightning:
    enabled: false
  # Absorption - Linh khi bi hap thu vao nguoi
  absorption:
    enabled: false
  # Ground Circle - Vong tron phap tran duoi chan
  ground-circle:
    enabled: false
  # Energy Pillar - Cot nang luong chieu len troi
  pillar:
    enabled: false
  # Ambient - Hat nang luong bay lo lung
  ambient:
    enabled: false

# ==========================================
# MAU PARTICLE /TULUYEN
# ==========================================
# Khi player /tuluyen, particle se tu dong doi mau theo color cua canh gioi hien tai trong realms.yml.
# class-colors giu lai de tranh pha config cu, hien khong dung cho /tuluyen.
class-colors:
  KIEMTON: [255, 215, 0, 255, 140, 0]       # Kiếm Tiên — Gold → Orange
  VANPHAP: [212, 160, 23, 139, 105, 20]     # Thiên Cơ — Dark Gold → Brown
  BATHE: [68, 136, 255, 34, 68, 170]        # Kim Thần — Blue → Dark Blue
  DUOCTIEN: [85, 255, 85, 0, 170, 68]       # Linh Dược — Green → Forest Green
  ANHSAT: [255, 68, 68, 255, 102, 0]        # Vô Ảnh — Red → Orange
  # Them class moi: "TEN_CLASS": [R1, G1, B1, R2, G2, B2]

# Cấu hình ModelEngine (Để trống "" nếu không có ModelEngine)
tuluyen-model: "be_tutien_tier1"

# Item khóa trên hotbar: bấm phím slot để chạy command, không thể drop/kéo/đổi tay.
hotbar-command-items:
  enabled: true
  # true = nếu slot đã có item khác thì trả item đó vào túi rồi đặt item khóa.
  replace-existing: true
  restore-delay-ticks: 2
  trigger:
    on-select: true
    # true = bấm phím chỉ chạy lệnh, không chuyển tay sang item khóa.
    cancel-select: true
    cooldown-ticks: 10
  messages:
    no-permission: "&cBạn không có quyền dùng nút này."
  items:
    skill-upgrade:
      enabled: true
      # Slot hotbar 1-9. Slot 8 = phím 8.
      slot: 8
      material: NETHER_STAR
      custom-model-data: 0
      hide-attributes: true
      name: "&b&lNâng Cấp Skill"
      lore:
        - "&7Bấm phím &e8 &7để mở nâng cấp skill."
        - "&7Lệnh: &f%command%"
        - ""
        - "&cKhông thể vứt hoặc di chuyển."
      command: "nangcapskill"
      as-console: false
      permission: ""
    equipment:
      enabled: true
      # Slot 9 = phím 9.
      slot: 9
      material: COMPASS
      custom-model-data: 0
      hide-attributes: true
      name: "&6&lTrang Bị"
      lore:
        - "&7Bấm phím &e9 &7để mở menu trang bị."
        - "&7Lệnh: &f%command%"
        - ""
        - "&cKhông thể vứt hoặc di chuyển."
      command: "trangbi"
      as-console: false
      permission: "tutiencore.use"

# ModelEngine kiếm bay hiển thị dưới chân khi người chơi đang fly
fly-sword:
  enabled: true
  model: "kiembay"
  # HEAD = use player head/eye as anchor, then lower the model with y-offset.
  # FEET = use player feet as anchor.
  anchor: HEAD
  # HEAD + -1.62 teleports the model from head down near player feet.
  y-offset: -1.62
  scale: 0.95
  # false = sword follows yaw only, not camera pitch up/down.
  follow-pitch: false
  animation:
    enabled: true
    idle: "idle"
    moving: "run"
    # Player movement distance per tick above this value switches the model to moving animation.
    moving-velocity-threshold: 0.015
  require-permission: false
  permission: "tutiencore.flysword"
  hide-while-spectator: true
  # Tự bật quyền bay khi player vào world được phép, không cần gõ /fly lại.
  auto-flight:
    enabled: true
    # Để [] hoặc ["*"] nếu muốn mọi world đều tự bật bay.
    worlds:
      - SuperiorWorld
    require-permission: false
    permission: "tutiencore.flysword"
    # Rời world không nằm trong list thì tắt allowFlight để tránh bay lạc world.
    disable-outside-world: true
  evolution:
    enabled: true
    default-level: 1
    info:
      - "&6Kiếm Bay &8| &fCấp: &e%level%"
      - "&7Model hiện tại: &f%model%"
      - "&7Model cấp sau: &e%next_model%"
      - "&7Linh thạch cần: &e%vault_cost%"
      - "&7Cổ thạch cần: &d%playerpoints_cost%"
      - "&7Nguyên liệu: &f%materials%"
      - "&e/ttc flysword evolve &7để tiến hoá."
    format:
      max-level: "Đã tối đa"
      no-materials: "Không cần"
    messages:
      disabled: "&cTiến hoá kiếm bay đang tắt."
