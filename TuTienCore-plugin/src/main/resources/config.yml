# Settings for the default action bar
action-bar:

  # Whether or not to use the default action bar.
  # (This doesn't change any other action bars provided by MMOCore.)
  enabled: true

  # The amount of ticks the bar will be
  # faded out when displaying other action bars.
  time-out: 60

  # The amount of ticks before updating the info
  ticks-to-update: 10

  # How to display the data.
  format: '{rotating} <#F8F894>❤ {health}/{max_health} &8| <#82cfe8>Linh Lực %TuTienClass_mana_left%/%TuTienClass_max_mana% &8| &aEXP %tutienlevel_exp_short%/%tutienlevel_next_exp_required_short%'
  # Hien EXP vua nhan tu TuTienLevel ben canh action bar cua TuTienCore.
  # Thông điệp xoay vòng ngẫu nhiên, chèn vào format qua placeholder {rotating}.
  # Mỗi interval-seconds sẽ random sang 1 dòng khác (không lặp lại dòng vừa hiện).
  rotating:
    enabled: true
    interval-seconds: 20
    messages:
      - "&e/menu &8|"
      - "&e/tuluyen &8|"
      - "&e/dotpha &8|"
      - "&e/bicanh &8|"
      - "&e/warp &8|"
      - "&e/rank &8|"
      - "&e/xu &8|"
      - "&e/tuyendung &8|"
  exp-gain:
    enabled: true
    # Thoi gian hien sau moi lan nhan EXP (ticks).
    duration-ticks: 40
    # Placeholder: {exp}, {exp_formatted}, {source}, {mob}
    format: ' &8| &a+{exp_formatted} EXP'
    # Mac dinh chi hien EXP kill MythicMob/quai tu TuTienLevel.
    # De [] neu muon hien moi nguon EXP TuTienLevel (api, command, ...).
    source-prefixes:
    - 'MythicMob:'
  money-gain:
    enabled: false
    # Thoi gian hien sau moi lan nhan money (ticks).
    duration-ticks: 40
    # {money} la tong money cuoi cung sau bonus rank.
    # Placeholder: {money}, {money_formatted}, {base_money}, {base_money_formatted},
    # {bonus_money}, {bonus_money_formatted}, {bonus_percent}, {source}, {mob}
    format: ' &8| &6+{money_formatted} Linh Thạch'
kill-reward-hologram:
  enabled: true
  y-offset: 1
  x-offset: 0.0
  z-offset: 0.0
  random-xz-radius: 0.25
  rise: 0.8
  duration-ticks: 50
  start-opacity: 255
  end-opacity: 0
  shadow: true
  see-through: true
  line-width: 160
  money:
    enabled: true
    # Placeholder: %money%, %money_formatted%, %base_money%, %bonus_money%, %bonus_percent%, %mob%, %player%
    text: '&6+%base_money% &8(&f%bonus_money%&8) &fLT ꐓ'
# Item khóa trên hotbar: bấm phím slot để chạy command, không thể drop/kéo/đổi tay.
hotbar-command-items:
  enabled: true
  # true = nếu slot đã có item khác thì trả item đó vào túi rồi đặt item khóa.
  replace-existing: true
  restore-delay-ticks: 2
  trigger:
    on-select: true
    # true = bấm phím chỉ chạy lệnh, không chuyển tay sang item khóa.
    cancel-select: true
    cooldown-ticks: 10
  messages:
    no-permission: '&cBạn không có quyền dùng nút này.'
  items:
    skill-upgrade:
      enabled: false
      # Slot hotbar 1-9. Slot 8 = phím 8.
      slot: 8
      material: NETHER_STAR
      custom-model-data: 0
      hide-attributes: true
      name: '&bNâng Cấp Thần thông'
      lore:
      - '&7Bấm phím &e8 &7để mở nâng cấp thần thông.'
      - '&7Lệnh: &f%command%'
      - ''
      - '&cKhông thể vứt hoặc di chuyển.'
      command: nangcapskill
      as-console: false
      permission: ''
    menu:
      enabled: false
      # Slot 9 = phím 9.
      slot: 9
      material: COMPASS
      custom-model-data: 0
      hide-attributes: true
      name: '&6Menu'
      lore:
      - '&7Bấm phím &e9 &7để mở menu trang bị.'
      - '&7Lệnh: &f%command%'
      - ''
      - '&cKhông thể vứt hoặc di chuyển.'
      command: menu
      as-console: false
      permission: tutiencore.use
player-hologram:
  enabled: true
  hide-while-tuluyen-hologram: true
  disable-name-team-packets-when-nexo: false
  # Hides the vanilla player nameplate by packet team data and uses a fake packet TextDisplay below instead.
  hide-vanilla-name: true
  hide-while-spectator: true
  # Show the hologram to its owner too. false = only other players see it.
  show-self: true
  # Position above player feet. Tune this if hats/models overlap.
  y-offset: 1.5
  passenger-base-offset: 1.35
  update-interval: 0
  teleport-duration: 1
  view-range: 20.0
  scale: 1.0
  spawn-animation:
    enabled: true
    start-scale: 0.2
    start-opacity: 10
    interpolation-duration: 1
    start-delay-ticks: 1
  line-width: 200
  text-shadow: true
  see-through: false
  default-background: false
  background-color:
    a: 0
    r: 0
    g: 0
    b: 0
  # Supports TuTien placeholders below and PlaceholderAPI placeholders.
  # Built-in: {player}, {display_name}, {health}, {health_int}, {max_health}, {max_health_int},
  # {tuvi}, {tuvi_int}, {tuvi_formatted}, {tuvi_compact}, {next_tuvi}, {next_tuvi_int},
  # {next_tuvi_formatted}, {next_tuvi_compact}, {realm}, {realm_full}, {sub_realm}, {realm_tier}, {world}
  lines:
  - '&f{player}'
  - '&c{health_int}/{max_health_int}❤'
tu-luyen:
  # Thoi gian (tick) de nhan Tu Vi (20 ticks = 1 giay)
  interval: 100
  # Khoang cach toi da tu cuc linh khi (blocks) de co the /tuluyen
  # Tần suất (tick) tính lại số Tu Vi xem trước hiển thị trên bossbar/hologram khi đang tu luyện.
  # Chỉ ảnh hưởng phần HIỂN THỊ, không ảnh hưởng Tu Vi thực nhận. Tăng số này để giảm tải MSPT/TPS
  # khi nhiều người tu luyện cùng lúc (mặc định 20 = mỗi giây cập nhật 1 lần).
  preview-refresh-ticks: 40
  max-distance: 10.0
  # Diem Tu Vi nhan duoc moi lan. Co the dung so co dinh (10) hoac random range (5-10).
  points-per-interval: 5-10
  # true = cong tat ca permission tutiencore.tuvi.bonus.* cua player.
  # false = chi lay permission bonus cao nhat.
  permission-bonus:
    stack: true
  # Command de cho diem Tu Vi, su dung %player% cho ten, va %points% cho so luong
  give-command: eco give %player% %points%
  breakthrough-bonus:
    enabled: true
    # % bonus cộng thêm cho mỗi lần đột phá thành công.
    percent-per-breakthrough: 25.0
    # Giới hạn tối đa % bonus cộng dồn. 0 = không giới hạn.
    max-percent: 0.0
  # Ti le Thien Loi ao danh xuong khi nhan Tu Vi. Neu trung, diem Tu Vi lan do duoc nhan multiplier.
  # strikeLightningEffect chi hien hieu ung/sound, khong gay sat thuong va khong tao lua.
  sounds:
    interval-reset:
      enabled: true
      # Ho tro ca Bukkit Sound enum va custom sound tu resource pack.
      # Vi du: ENTITY_EXPERIENCE_ORB_PICKUP hoac yourpack:tu_luyen_cycle
      sound: block.beacon.activate
      category: MASTER
      volume: 1.0
      pitch: 0.8
  lightning-bonus:
    enabled: true
    chance-percent: 20.0
    multiplier: 2.0
  bossbar:
    enabled: false
    color: BLUE
    style: SEGMENTED_10
    title: '&fTu Vi sắp nhận &6{total} &8| &fCó thể đột phá: %tutien_dotpha_ready%
      &8(/dotpha) &8|&f %tutien_tuvi_compact%&8/&6%tutien_dotpha_next_tuvi_required%'
  hologram:
    enabled: true
    # Requires FancyHolograms. Hologram is created when /tuluyen starts and removed when it stops.
    y-offset: 2.4
    scale: 1.0
    spawn-animation:
      enabled: true
      start-scale: 0.2
      start-opacity: 10
      interpolation-duration: 1
      start-delay-ticks: 1
    visibility-distance: 32
    update-interval: 20
    text-shadow: true
    see-through: false
    lines:
    - '&bThời Tiết: &b+{weather_bonus}%'
    - '&fBonus: &a+{total_bonus}%'
    - '&5Lửa Thần: &d+{infusion}%'
    - '&fTu vi: &6+{total} &8| &f%tutien_dotpha_ready%'
    - '&f%tutien_tuvi_int%&8/&6%tutien_dotpha_next_tuvi_required%'
    - '%tutien_canhgioi_full%'
    team-bonus:
      enabled: true
      # Hien khi BetterteamsAddon bao player co dong doi cung /tuluyen trong pham vi.
      # Placeholder: {team_bonus}, {team_multiplier}
      lines:
      - '&aTông môn: &f+{team_bonus}%'
  environment-bonus:
    worlds: {}
    regions: {}

offline-tuluyen:
  # Player có permission này nhận 100% Tu Vi offline.
  # Player thường vẫn được tích Tu Vi offline, nhưng chỉ nhận theo default-multiplier.
  permission: tutiencore.tuluyen.vip
  # Offline reward dung points-per-interval ben tren, nhung moi 60 giay offline moi tinh 1 lan.
  interval-seconds: 60
  # 0.5 = player thường nhận 50% Tu Vi offline.
  default-multiplier: 0.5
  # 1.0 = player có permission bên trên nhận 100% Tu Vi offline.
  permission-multiplier: 1.0
  # Giới hạn thời gian offline được cộng Tu Vi. 0 = không giới hạn.
  max-offline-hours: 8
  open-gui:
    # true = đợi resource pack load xong mới mở GUI nhận Tu Vi offline.
    after-resourcepack: true
    # Chỉ mở GUI nếu lần offline vừa rồi lâu hơn số giây này.
    min-offline-seconds: 60
    # Nếu không đợi resource pack, mở GUI sau delay này.
    delay-ticks: 20
    # Nếu server/client không gửi trạng thái resource pack, tự mở sau delay này để khỏi kẹt.
    fallback-delay-ticks: 300
  # Chi phi PlayerPoints khi claim x2.
  claim-x2-cost: 0
  claim-x2:
    # true = player phai co permission thue thang moi duoc bam nhan x2.
    # Vi du LuckPerms thue 30 ngay:
    # /lp user <player> permission settemp tutiencore.tuluyen.offline.x2 true 30d
    require-permission: true
    permission: "tutiencore.tuluyen.offline.x2"
afk-kick:
  enabled: true
  permission-prefix: tutiencore.vip.
  bypass-permission: tutiencore.afk.bypass
  default-rank: 0
  check-interval: 1s
  # Đứng yên/không đánh/không click trong thời gian này mới bắt đầu bị tính AFK.
  afk-start-after: 10s
  kick-message: '&cBạn đã AFK quá lâu. Hãy quay lại khi sẵn sàng tiếp tục tu luyện.'
  title:
    enabled: true
    title: '&6&lĐang AFK'
    subtitle: '&eCòn &c%time% &enữa sẽ bị rời khỏi máy chủ.'
    fade-in: 5
    stay: 45
    fade-out: 10
    repeat-interval: 1s
  warning:
    enabled: true
    before-kick: 30s
    message: '&eBạn đang AFK quá lâu. Còn &c%time% &enữa sẽ bị rời khỏi máy chủ.'
  activity:
    # true = chỉ xoay camera không tính là hoạt động, phải di chuyển/chat/click/chạy lệnh.
    ignore-look-only: true
    movement-threshold: 0.08
  ranks:
    '0':
      permission: ''
      kick-after: 10m
    '1':
      permission: tutiencore.vip.1
      kick-after: 30m
    '2':
      permission: tutiencore.vip.2
      kick-after: 1h
    '3':
      permission: tutiencore.vip.3
      kick-after: 2h
    '4':
      permission: tutiencore.vip.4
      kick-after: never
    '5':
      permission: tutiencore.vip.5
      kick-after: never
# ==========================================
# PERMISSIONS
# ==========================================
# tutiencore.use               - Cho phep /tuluyen va /dotpha (default: true)
# tutiencore.admin             - Quyen admin: /canhgioi, /tuvi (default: op)
#
# Tu Vi Bonus (buff diem thu thap Tu Vi khi tu luyen):
#   tutiencore.tuvi.bonus.<phan_tram>
#   VD:
#     tutiencore.tuvi.bonus.20   → +20% Tu Vi (10 diem → 12 diem)
#     tutiencore.tuvi.bonus.50   → +50% Tu Vi (10 diem → 15 diem)
#     tutiencore.tuvi.bonus.100  → +100% Tu Vi (10 diem → 20 diem)
#
#   Neu player co nhieu bonus perm → lay gia tri CAO NHAT.
#
#   LuckPerms setup:
#     /lp group vip permission set tutiencore.tuvi.bonus.20
#     /lp group svip permission set tutiencore.tuvi.bonus.50
#     /lp group mvp permission set tutiencore.tuvi.bonus.100

# ==========================================
# PLACEHOLDERS
# ==========================================
# Ban co the su dung cac Placeholder thong qua PlaceholderAPI:
#
# Thong tin ca nhan (Single Player):
# %tutien_tuvi%            - Tu Vi nguyen goc (VD: 15.5)
# %tutien_tuvi_int%        - Tu Vi so nguyen (VD: 15)
# %tutien_tuvi_formatted%  - Tu Vi co dau phay (VD: 1,500)
# %tutien_tuvi_compact%    - Tu Vi dang gon (VD: 1.5k, 2M)
#
# Canh Gioi (Realm):
# %tutien_canhgioi_full%   - ★ CHINH: display-name tu realms.yml (VD: §a「Luyen Khi」)
# %tutien_canhgioi%        - Ten khong mau (VD: Luyen Khi)
# %tutien_canhgioi_id%     - So thu tu (VD: 2)
# %tutien_canhgioi_tang%   - Tang nho hien tai (VD: Dinh Phong)
# %tutien_canhgioi_daigioi% - Dai gioi (VD: Pham Gioi)
# %tutien_canhgioi_english% - Ten tieng Anh (VD: Qi Refinement)
# %tutien_dotpha_cooldown% - Cooldown dot pha con lai (giay)
# %tutien_dotpha_ready%    - San sang dot pha? (true/false)
# %tutien_dotpha_next_tuvi_required% - Tu Vi can cho dot pha tiep theo
#
# Thong tin bang xep hang (Leaderboard) (Noi X la vi tri hang):
# %tutien_top_name_X%            - Ten nguoi choi hang X (VD: %tutien_top_name_1%)
# %tutien_top_tuvi_X%            - Tu Vi cua hang X (So goc)
# %tutien_top_tuvi_int_X%        - Tu Vi cua hang X (So nguyen)
# %tutien_top_tuvi_formatted_X%  - Tu Vi cua hang X (Co dau phay)
# %tutien_top_tuvi_compact_X%    - Tu Vi cua hang X (Dang gon)
# ==========================================

placeholders:
  tuluyen-time:
    # Placeholder ho tro: {total_seconds}, {seconds_total}, {total_minutes}, {minutes_total},
    # {total_hours}, {hours_total}, {days}, {hours}, {minutes}, {seconds}, {hh}, {mm}, {ss},
    # {hms}, {compact}. {hh} la tong gio co padding 2 chu so.
    format: "{compact}"
    # Placeholder them cho top-format: {rank}, {name}.
    top-format: "&e#{rank} &f{name} &7- &a{compact}"
    empty-name: "---"
  # Định dạng dòng lore của Đột Phá Đan trong Menu Đột Phá
  # Hỗ trợ placeholder: {status}, {have}, {required}
  dot-pha-dan-lore-format: " {status} &7Đột Phá Đan: &b{have} &7/ &e{required}"
  dot-pha-dan-empty-lore: ""
  breakthrough-bonus-lore-format: " &7Tu Vi tu luyện: &a+{breakthrough_bonus_current}% &7→ &a+{breakthrough_bonus_next}% &7(&b+{breakthrough_bonus_gain}%&7)"
  breakthrough-bonus-empty-lore: "{_REMOVE_LINE_}"
  # Định dạng tiêu đề và từng dòng lore nguyên liệu trong Menu Đột Phá
  materials-header-lore: "&8ʏêᴜ ᴄầᴜ ᴠậᴛ ᴘʜẩᴍ ᴋʜáᴄ:"
  # Hỗ trợ placeholder: {status}, {display}, {have}, {required}
  materials-lore-format: " {status} &7{display}: &b{have} &7/ &e{required}"
  materials-empty-lore: ""
  dotpha-ready:
    # Output cua %tutien_dotpha_ready% khi nguoi choi du dieu kien dot pha.
    ready-display-name: '&a✔'
    # Output cua %tutien_dotpha_ready% khi nguoi choi chua du dieu kien dot pha.
    not-ready-display-name: <#B33434>❌
  dotpha-next-tuvi-required:
    # Output cua %tutien_dotpha_next_tuvi_required%.
    # Placeholder ho tro: {value} = so Tu Vi can, da format dau phay.
    display-name: '{value}'

particles:
  sphere:
    # Co bat sphere particle khong
    enabled: true
    interval: 5
    radius: 1.0
    points: 100
    color:
      r: 66
      g: 245
      b: 227
  line:
    spacing: 0.2
    duration: 10
    color:
      r: 255
      g: 255
      b: 255

# ==========================================
# HIEU UNG TU LUYEN (Cultivation Effects)
# ==========================================
# Cau hinh hieu ung khi nguoi choi tu luyen
# Moi layer co the bat/tat rieng le
cultivation-effects:
  # Màu chủ đạo (Cyan/Xanh dương)
  view-distance: 12
  primary-color:
    r: 0
    g: 220
    b: 255
  # Double Helix - Vòng xoay năng lượng quanh người
  helix:
    enabled: false
  # Spirit Gate Rays - vong tron nho o xa player roi phong ray vao player
  rays:
    enabled: true
    # Moi interval tick task se tao 1-2 "cong linh khi" o xa player.
    # Cong la mot vong tron nho, sau do phong ray vao player.
    interval: 2
    count-min: 1
    count-max: 2
    distance-min: 2.8
    distance-max: 4.2
    y-min: 0.8
    y-max: 2.4
    target-y-offset: 1.15
    circle-radius: 0.35
    circle-points: 18
    circle-size: 0.65
    circle-rotation-speed: 0.22
    ray-points: 16
    ray-start-size: 0.35
    ray-end-size: 1.1
    ray-spiral-radius: 0.055
    end-rod-trail: true
  # Lightning Arcs - Sét điện quanh người
  lightning:
    enabled: false
  # Absorption - Linh khí bị hấp thu vào người
  absorption:
    enabled: false
  # Ground Circle - Vòng tròn pháp trận dưới chân
  ground-circle:
    enabled: false
  # Energy Pillar - Cột năng lượng chiếu lên trời
  pillar:
    enabled: false
  # Ambient - Hạt năng lượng bay lơ lửng
  ambient:
    enabled: false

