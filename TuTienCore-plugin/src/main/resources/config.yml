# YAML chỉ còn là backup / migration seed khi server đổi máy.
database:
  enabled: true
  type: mysql
  mysql:
    host: "185.207.166.124"
    port: 1032
    database: "s11652_tutiencore"
    username: "u11652_dhbZBwkVVn"
    password: "^jDL0.zYjA0IZTL@@Uvb8Wz!"
    use-ssl: false

# MySQL database riêng cho /trangbi — LƯU TRỮ CHÍNH cho equipment và bound offhand.
# Lưu mmo-type/mmo-id/duration của từng slot và bound offhand.
