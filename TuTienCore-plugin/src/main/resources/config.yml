# TuTienCore Configuration
# Plugin version: 1.0.0

debug: false

# Settings for the default action bar
action-bar:

  # Whether or not to use the default action bar.
  # (This doesn't change any other action bars provided by MMOCore.)
  enabled: true

  # The amount of ticks the bar will be
  # faded out when displaying other action bars.
  time-out: 60

  # The amount of ticks before updating the info
  ticks-to-update: 5

  # How to display the data.
  # Dùng {rotating} để chèn thông điệp xoay vòng (xem action-bar.rotating bên dưới).
  format: '&f༺ <#f03e5c>❤ {health}/{max_health} &f| <#82cfe8>〄 Linh Lực %TuTienClass_mana_left%/%TuTienClass_max_mana% &f༻'

  # Thông điệp xoay vòng ngẫu nhiên, chèn vào format qua placeholder {rotating}.
  # Mỗi interval-seconds sẽ random sang 1 dòng khác (không lặp lại dòng vừa hiện).
  rotating:
    enabled: false
    interval-seconds: 10
    messages:
      - "&f| &e/buy &7| &c❤ &f| &b✦ Mana"
      - "&f| &e/shop &7| &c❤ &f| &b✦ Mana"
      - "&f| &e/daily &7| &7Nhận quà mỗi ngày"
      - "&f| &e/rank &7| &7Xem bảng xếp hạng"

  # Hiện EXP vừa nhận từ TuTienLevel bên cạnh action bar của TuTienCore.
  exp-gain:
    enabled: true
    # Thời gian hiện sau mỗi lần nhận EXP (ticks).
    duration-ticks: 40
    # Placeholder: {exp}, {exp_formatted}, {source}, {mob}
    format: " &8| &a+{exp_formatted} EXP"
    # Mặc định chỉ hiện EXP kill MythicMob/quái từ TuTienLevel.
    # Để [] nếu muốn hiện mọi nguồn EXP TuTienLevel (api, command, ...).
    source-prefixes:
      - "MythicMob:"
  # Hiện Linh Thạch vừa nhận từ MythicMobs money drop bên cạnh action bar.
  money-gain:
    enabled: false
    # Thời gian hiện sau mỗi lần nhận money (ticks).
    duration-ticks: 40
    # {money} là tổng money cuối cùng sau bonus rank.
    # Placeholder: {money}, {money_formatted}, {base_money}, {base_money_formatted},
    # {bonus_money}, {bonus_money_formatted}, {bonus_percent}, {source}, {mob}
    format: " &8| &6+{money_formatted} Linh Thạch"

# Configurable command aliases.
# Set aliases: [] to disable aliases for a command.
commands:
  ttc:
    aliases: []
  tuluyen:
    aliases: [tl]
  dotpha:
    aliases: [dp]
  canhgioi:
    aliases: [realm]
  tuvi:
    aliases: []
  thauthi:
    aliases: []

mythicmobs-money-bonus:
  enabled: true
  # Áp dụng cho money drop native của MythicMobs, ví dụ: "- money 100-300 1".
  # Permission dạng: tutiencore.mythicmoney.bonus.<phan_tram>
  permission-prefix: "tutiencore.mythicmoney.bonus."
  # true = cộng tất cả permission bonus tiền của player.
  # false = chỉ lấy permission bonus cao nhất.
  stack: true
  debug: false

# Hologram fade khi kill quái, giống popup EXP của TuTienLevel.
# Text hiện tại dùng money sau khi đã cộng bonus rank/VIP.
kill-reward-hologram:
  enabled: true
  y-offset: 1.35
  x-offset: 0.0
  z-offset: 0.0
  random-xz-radius: 0.25
  rise: 0.8
  duration-ticks: 35
  start-opacity: 255
  end-opacity: 0
  shadow: true
  see-through: true
  line-width: 160
  money:
    enabled: true
    # Placeholder: %money%, %money_formatted%, %base_money%, %bonus_money%, %bonus_percent%, %mob%, %player%
    text: "&6+%money_formatted% Linh Thạch"

player-hologram:
  enabled: true
  # Hides the vanilla player nameplate by packet team data and uses a fake packet TextDisplay passenger above the player.
  hide-vanilla-name: true
  # true = if Nexo is installed, skip ttc_hide_names team packets to avoid packet transformer errors.
  disable-name-team-packets-when-nexo: true
  # Hide this player nametag while the /tuluyen FancyHolograms hologram is active.
  hide-while-tuluyen-hologram: true
  # Hide this player's info hologram while they are in spectator mode.
  hide-while-spectator: true
  # Show the hologram to its owner too. false = only other players see it.
  show-self: false
  # Final height above player feet. Tune this if hats/models overlap.
  y-offset: 2.55
  # Client passenger anchor for a standing player. y-offset - passenger-base-offset becomes the TextDisplay translation.
  passenger-base-offset: 1.35
  update-interval: 5
  teleport-duration: 2
  view-range: 32.0
  scale: 1.0
  spawn-animation:
    enabled: true
    start-scale: 0.82
    start-opacity: 40
    interpolation-duration: 1
    start-delay-ticks: 1
  line-width: 200
  text-shadow: true
  see-through: false
  default-background: false
  background-color:
    a: 0
    r: 0
    g: 0
    b: 0
  # Supports TuTien placeholders below and PlaceholderAPI placeholders.
  # Built-in: {player}, {display_name}, {health}, {health_int}, {max_health}, {max_health_int},
  # {tuvi}, {tuvi_int}, {tuvi_formatted}, {tuvi_compact}, {next_tuvi}, {next_tuvi_int},
  # {next_tuvi_formatted}, {next_tuvi_compact}, {realm}, {realm_full}, {sub_realm}, {realm_tier}, {world}
  lines:
    - "&8[&6*&8] &f{player}"
    - "&7{realm_full}"
    - "&fTu Vi: &a{tuvi_compact}"

tu-luyen:
  # Thời gian (tick) để nhận Tu Vi (20 ticks = 1 giây)
  interval: 100
  # Khoảng cách tối đa từ cực linh khí (blocks) để có thể /tuluyen
  max-distance: 10.0
  # Điểm Tu Vi nhận được mỗi lần.
  points-per-interval: 10
  # true = cộng tất cả permission tutiencore.tuvi.bonus.* của player.
  # false = chỉ lấy permission bonus cao nhất.
  permission-bonus:
    stack: true
  # Command để cho điểm Tu Vi, sử dụng %player% cho tên, và %points% cho số lượng
  give-command: "eco give %player% %points%"
  # Tỉ lệ Thiên Lôi ảo đánh xuống khi nhận Tu Vi. Nếu trúng, điểm Tu Vi lần đó được nhân multiplier.
  # strikeLightningEffect chỉ hiện hiệu ứng/sound, không gây sát thương và không tạo lửa.
  lightning-bonus:
    enabled: true
    chance-percent: 20.0
    multiplier: 2.0
  sounds:
    interval-reset:
      enabled: true
      # Hỗ trợ cả Bukkit Sound enum và custom sound từ resource pack.
      # Ví dụ: ENTITY_EXPERIENCE_ORB_PICKUP hoặc yourpack:tu_luyen_cycle
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
      category: MASTER
      volume: 1.0
      pitch: 1.15
  bossbar:
    enabled: false
    color: BLUE
    style: SEGMENTED_10
    title: "&bTu Vi sắp nhận: &e{base} &7+ &aBonus {bonus}% &7+ &dMôi Trường {environment}% &7= &6{total}"
  hologram:
    enabled: true
    # Requires FancyHolograms. Hologram is created when /tuluyen starts and removed when it stops.
    y-offset: 2.4
    scale: 1.0
    spawn-animation:
      enabled: true
      start-scale: 0.82
      start-opacity: 40
      interpolation-duration: 1
      start-delay-ticks: 1
    visibility-distance: 32
    update-interval: 20
    text-shadow: true
    see-through: false
    # Placeholders: {bonus}=quyền+Tiên Phù, {infusion}=Lửa Thần, {total_bonus}=bonus+Lửa Thần, {all_bonus}=total_bonus+môi trường.
    lines:
      - "&eTrạng thái: &aBế quan tu luyện"
      - ""
      - "&fCơ bản: &b+{base}"
      - ""
      - "&aBonus: &a+{total_bonus}%"
      - "&5Lửa Thần: &d+{infusion}%"
      - "&dMôi Trường Tu Luyện: &d+{environment}%"
      - "&6Tu Vi Thực Nhận: &6+{total}"
    team-bonus:
      enabled: true
      # Hiện khi BetterteamsAddon báo player có đồng đội cùng /tuluyen trong phạm vi.
      # Placeholder: {team_bonus}, {team_multiplier}
      lines:
        - "&aTông môn: &f+{team_bonus}%"
  environment-bonus:
    worlds: {}
    regions: {}

offline-tuluyen:
  # Player có permission này nhận 100% Tu Vi offline.
  # Player thường vẫn được tích Tu Vi offline, nhưng chỉ nhận theo default-multiplier.
  permission: "tutiencore.tuluyen.vip"
  # Offline reward dùng points-per-interval bên trên, nhưng mỗi 60 giây offline mới tính 1 lần.
  interval-seconds: 60
  # 0.5 = player thường nhận 50% Tu Vi offline.
  default-multiplier: 0.5
  # 1.0 = player có permission bên trên nhận 100% Tu Vi offline.
  permission-multiplier: 1.0
  # Giới hạn thời gian offline được cộng Tu Vi. 0 = không giới hạn.
  max-offline-hours: 8
  open-gui:
    # true = đợi resource pack load xong mới mở GUI nhận Tu Vi offline.
    after-resourcepack: true
    # Chỉ mở GUI nếu lần offline vừa rồi lâu hơn số giây này.
    min-offline-seconds: 60
    # Nếu không đợi resource pack, mở GUI sau delay này.
    delay-ticks: 20
    # Nếu server/client không gửi trạng thái resource pack, tự mở sau delay này để khỏi kẹt.
    fallback-delay-ticks: 300
  # Chi phí PlayerPoints khi claim x2.
  claim-x2-cost: 100
  claim-x2:
    # true = player phải có permission thuê tháng mới được bấm nhận x2.
    # Ví dụ LuckPerms thuê 30 ngày:
    # /lp user <player> permission settemp tutiencore.tuluyen.offline.x2 true 30d
    require-permission: true
    permission: "tutiencore.tuluyen.offline.x2"

# Kick người chơi AFK theo rank VIP.
# Plugin lấy rank cao nhất mà player có permission theo dạng:
#   tutiencore.vip.0, tutiencore.vip.1, tutiencore.vip.2...
# VIP 0 là rank mặc định cho mọi người chơi nếu không có permission VIP cao hơn.
afk-kick:
  enabled: true
  permission-prefix: "tutiencore.vip."
  bypass-permission: "tutiencore.afk.bypass"
  default-rank: 0
  check-interval: 1s
  # Đứng yên/không đánh/không click trong thời gian này mới bắt đầu bị tính AFK.
  afk-start-after: 10s
  kick-message: "&cBạn đã AFK quá lâu. Hãy quay lại khi sẵn sàng tiếp tục tu luyện."
  title:
    enabled: true
    title: "&6&lĐang AFK"
    subtitle: "&eCòn &c%time% &enữa sẽ bị rời khỏi máy chủ."
    fade-in: 5
    stay: 45
    fade-out: 10
    repeat-interval: 10s
  warning:
    enabled: true
    before-kick: 30s
    message: "&eBạn đang AFK quá lâu. Còn &c%time% &enữa sẽ bị rời khỏi máy chủ."
  activity:
    # true = chỉ xoay camera không tính là hoạt động, phải di chuyển/chat/click/chạy lệnh.
    ignore-look-only: true
    movement-threshold: 0.08
  ranks:
    0:
      permission: ""
      kick-after: 10m
    1:
      permission: "tutiencore.vip.1"
      kick-after: 30m
    2:
      permission: "tutiencore.vip.2"
      kick-after: 1h
    3:
      permission: "tutiencore.vip.3"
      kick-after: 2h
    4:
      permission: "tutiencore.vip.4"
      kick-after: never
    5:
      permission: "tutiencore.vip.5"
      kick-after: never

# ==========================================
# PERMISSIONS
# ==========================================
# tutiencore.use               - Cho phép /tuluyen và /dotpha (default: true)
# tutiencore.admin             - Quyền admin: /canhgioi, /tuvi (default: op)
# tutiencore.tuluyen.vip       - Tích Tu Vi offline và mở GUI claim khi vào lại server
#
# Tu Vi Bonus (buff điểm thu thập Tu Vi khi tu luyện):
#   tutiencore.tuvi.bonus.<phan_tram>
#   VD:
#     tutiencore.tuvi.bonus.20   → +20% Tu Vi (10 điểm → 12 điểm)
#     tutiencore.tuvi.bonus.50   → +50% Tu Vi (10 điểm → 15 điểm)
#     tutiencore.tuvi.bonus.100  → +100% Tu Vi (10 điểm → 20 điểm)
#
#   Mặc định tu-luyen.permission-bonus.stack: true sẽ CỘNG DỒN tất cả giá trị hợp lệ.
#   VD: có tutiencore.tuvi.bonus.30 và tutiencore.tuvi.bonus.50 → +80% Tu Vi.
#   Nếu stack: false thì chỉ lấy permission cao nhất → +50% Tu Vi.
#
#   LuckPerms setup:
#     /lp group vip permission set tutiencore.tuvi.bonus.20
#     /lp group svip permission set tutiencore.tuvi.bonus.50
#     /lp group mvp permission set tutiencore.tuvi.bonus.100
#
# MythicMobs Money Bonus:
#   tutiencore.mythicmoney.bonus.<phan_tram>
#   Áp dụng cho drop MythicMobs dạng "- money 100-300 1".
#   VD: mob drop 300, player có tutiencore.mythicmoney.bonus.20 -> nhận thêm 60.
#   mythicmobs-money-bonus.stack: true sẽ cộng dồn nhiều permission, false chỉ lấy cao nhất.

# ==========================================
# PLACEHOLDERS
# ==========================================
# Bạn có thể sử dụng các Placeholder thông qua PlaceholderAPI:
# 
# Thông tin cá nhân (Single Player):
# %tutien_tuvi%            - Tu Vi nguyên gốc (VD: 15.5)
# %tutien_tuvi_int%        - Tu Vi số nguyên (VD: 15)
# %tutien_tuvi_formatted%  - Tu Vi có dấu phẩy (VD: 1,500)
# %tutien_tuvi_compact%    - Tu Vi dạng gọn (VD: 1.5k, 2M)
#
# Thời gian tu luyện:
# %tutien_tuluyen_active%          - true/false đang /tuluyen
# %tutien_tuluyen_time_seconds%    - Tổng thời gian tu luyện, tính bằng giây
# %tutien_tuluyen_time%            - Tổng thời gian dạng HH:mm:ss
# %tutien_tuluyen_time_compact%    - Tổng thời gian rút gọn, ví dụ 1h 20m
# %tutien_tuluyen_session_seconds% - Thời gian phiên /tuluyen hiện tại, tính bằng giây
# %tutien_tuluyen_session_time%    - Thời gian phiên hiện tại dạng HH:mm:ss
# %tutien_tuluyen_session_compact% - Thời gian phiên hiện tại rút gọn
# 
# Cảnh Giới (Realm):
# %tutien_canhgioi_full%   - ★ CHÍNH: display-name từ realms.yml (VD: §a「Luyện Khí」)
# %tutien_canhgioi%        - Tên không màu (VD: Luyện Khí)
# %tutien_canhgioi_id%     - Số thứ tự (VD: 2)
# %tutien_canhgioi_tang%   - Tầng nhỏ hiện tại (VD: Đỉnh Phong)
# %tutien_canhgioi_daigioi% - Đại giới (VD: Phàm Giới)
# %tutien_canhgioi_english% - Tên tiếng Anh (VD: Qi Refinement)
# %tutien_dotpha_cooldown% - Cooldown đột phá còn lại (giây)
# %tutien_dotpha_ready%    - Sẵn sàng đột phá? (true/false)
# %tutien_dotpha_next_tuvi_required% - Tu Vi cần cho đột phá tiếp theo
# 
# Thông tin bảng xếp hạng (Leaderboard) (Nơi X là vị trí hạng):
# %tutien_top_name_X%            - Tên người chơi hạng X (VD: %tutien_top_name_1%)
# %tutien_top_tuvi_X%            - Tu Vi của hạng X (Số gốc)
# %tutien_top_tuvi_int_X%        - Tu Vi của hạng X (Số nguyên)
# %tutien_top_tuvi_formatted_X%  - Tu Vi của hạng X (Có dấu phẩy)
# %tutien_top_tuvi_compact_X%    - Tu Vi của hạng X (Dạng gọn)
# ==========================================

placeholders:
  tuluyen-time:
    # Placeholder ho tro: {total_seconds}, {seconds_total}, {total_minutes}, {minutes_total},
    # {total_hours}, {hours_total}, {days}, {hours}, {minutes}, {seconds}, {hh}, {mm}, {ss},
    # {hms}, {compact}. {hh} la tong gio co padding 2 chu so.
    format: "{compact}"
    # Placeholder them cho top-format: {rank}, {name}.
    top-format: "&e#{rank} &f{name} &7- &a{compact}"
    empty-name: "---"
  dotpha-ready:
    # Output của %tutien_dotpha_ready% khi người chơi đủ điều kiện đột phá.
    ready-display-name: "V"
    # Output của %tutien_dotpha_ready% khi người chơi chưa đủ điều kiện đột phá.
    not-ready-display-name: "X"
  dotpha-next-tuvi-required:
    # Output của %tutien_dotpha_next_tuvi_required%.
    # Placeholder hỗ trợ: {value} = số Tu Vi cần, đã format dấu phẩy.
    display-name: "{value}"

  # Định dạng dòng lore của Đột Phá Đan trong Menu Đột Phá
  # Hỗ trợ placeholder: {status}, {have}, {required}
  dot-pha-dan-lore-format: " {status} &7Đột Phá Đan: &b{have} &7/ &e{required}"
  dot-pha-dan-empty-lore: "{_REMOVE_LINE_}"

  # Định dạng tiêu đề và từng dòng lore nguyên liệu trong Menu Đột Phá
  materials-header-lore: "&8ʏêᴜ ᴄầᴜ ᴠậᴛ ᴘʜẩᴍ ᴋʜáᴄ:"
  # Hỗ trợ placeholder: {status}, {display}, {have}, {required}
  materials-lore-format: " {status} &7{display}: &b{have} &7/ &e{required}"
  materials-empty-lore: "{_REMOVE_LINE_}"

particles:
  sphere:
    # Có bật sphere particle không
    enabled: true
    interval: 5
    radius: 1.0
    points: 100
    color:
      r: 66
      g: 245
      b: 227
  line:
    spacing: 0.2
    duration: 10
    color:
      r: 255
      g: 255
      b: 255

# ==========================================
# HIỆU ỨNG TU LUYỆN (Cultivation Effects)
# ==========================================
# Cấu hình hiệu ứng khi người chơi tu luyện
# Mỗi layer có thể bật/tắt riêng lẻ
cultivation-effects:
  # Chỉ tạo particle khi có người chơi trong bán kính này (block). Tối ưu hiệu năng:
  # không người xem thì task bỏ qua hoàn toàn, không tốn CPU dựng hình.
  view-distance: 48
  # Màu chủ đạo (Cyan/Xanh dương)
  primary-color:
    r: 0
    g: 220
    b: 255
  # Double Helix - Vòng xoay năng lượng quanh người
  helix:
    enabled: true
  # Spirit Gate Rays - vong tron nho o xa player roi phong ray vao player
  rays:
    enabled: true
    # Moi interval tick task se tao 1-2 "cong linh khi" o xa player.
    # Cong la mot vong tron nho, sau do phong ray vao player.
    interval: 2
    count-min: 1
    count-max: 2
    distance-min: 2.8
    distance-max: 4.2
    y-min: 0.8
    y-max: 2.4
    target-y-offset: 1.15
    circle-radius: 0.35
    circle-points: 18
    circle-size: 0.65
    circle-rotation-speed: 0.22
    ray-points: 16
    ray-start-size: 0.35
    ray-end-size: 1.1
    ray-spiral-radius: 0.055
    end-rod-trail: true
  # Lightning Arcs - Sét điện quanh người
  lightning:
    enabled: false
  # Absorption - Linh khí bị hấp thu vào người
  absorption:
    enabled: false
  # Ground Circle - Vòng tròn pháp trận dưới chân
  ground-circle:
    enabled: false
  # Energy Pillar - Cột năng lượng chiếu lên trời
  pillar:
    enabled: false
  # Ambient - Hạt năng lượng bay lơ lửng
  ambient:
    enabled: false

# ==========================================
# MAU PARTICLE /TULUYEN
# ==========================================
# Khi player /tuluyen, particle sẽ tự động đổi màu theo color của cảnh giới hiện tại trong realms.yml.
# class-colors giữ lại để tránh phá config cũ, hiện không dùng cho /tuluyen.
class-colors:
  KIEMTON: [255, 215, 0, 255, 140, 0]       # Kiếm Tiên — Gold → Orange
  VANPHAP: [212, 160, 23, 139, 105, 20]     # Thiên Cơ — Dark Gold → Brown
  BATHE: [68, 136, 255, 34, 68, 170]        # Kim Thần — Blue → Dark Blue
  DUOCTIEN: [85, 255, 85, 0, 170, 68]       # Linh Dược — Green → Forest Green
  ANHSAT: [255, 68, 68, 255, 102, 0]        # Vô Ảnh — Red → Orange
  # Thêm class mới: "TEN_CLASS": [R1, G1, B1, R2, G2, B2]

# Cấu hình ModelEngine (Để trống "" nếu không có ModelEngine)
tuluyen-model: "be_tutien_tier1"

# Item khóa trên hotbar: bấm phím slot để chạy command, không thể drop/kéo/đổi tay.
hotbar-command-items:
  enabled: true
  # true = nếu slot đã có item khác thì trả item đó vào túi rồi đặt item khóa.
  replace-existing: true
  restore-delay-ticks: 2
  trigger:
    on-select: true
    # true = bấm phím chỉ chạy lệnh, không chuyển tay sang item khóa.
    cancel-select: true
    cooldown-ticks: 10
  messages:
    no-permission: "&cBạn không có quyền dùng nút này."
  items:
    skill-upgrade:
      enabled: true
      # Slot hotbar 1-9. Slot 8 = phím 8.
      slot: 8
      material: NETHER_STAR
      custom-model-data: 0
      hide-attributes: true
      name: "&b&lNâng Cấp Skill"
      lore:
        - "&7Bấm phím &e8 &7để mở nâng cấp skill."
        - "&7Lệnh: &f%command%"
        - ""
        - "&cKhông thể vứt hoặc di chuyển."
      command: "nangcapskill"
      as-console: false
      permission: ""
    equipment:
      enabled: true
      # Slot 9 = phím 9.
      slot: 9
      material: COMPASS
      custom-model-data: 0
      hide-attributes: true
      name: "&6&lTrang Bị"
      lore:
        - "&7Bấm phím &e9 &7để mở menu trang bị."
        - "&7Lệnh: &f%command%"
        - ""
        - "&cKhông thể vứt hoặc di chuyển."
      command: "trangbi"
      as-console: false
      permission: "tutiencore.use"

# ModelEngine kiếm bay hiển thị dưới chân khi người chơi đang fly
fly-sword:
  enabled: true
  model: "kiembay"
  # HEAD = use player head/eye as anchor, then lower the model with y-offset.
  # FEET = use player feet as anchor.
  anchor: HEAD
  # HEAD + -1.62 teleports the model from head down near player feet.
  y-offset: -1.62
  scale: 0.95
  # false = sword follows yaw only, not camera pitch up/down.
  follow-pitch: false
  animation:
    enabled: true
    idle: "idle"
    moving: "run"
    # Player movement distance per tick above this value switches the model to moving animation.
    moving-velocity-threshold: 0.015
  require-permission: false
  permission: "tutiencore.flysword"
  hide-while-spectator: true
  equipped:
    enabled: true
    slot: fly_sword
    models:
      FLY_SWORD:
        THANH_PHONG_KIEM:
          model: "kiembay"
        DINH_BA_KIEM:
          model: "kiembay_dinhba"
        HA_CAM_KIEM:
          model: "kiembay_hacam"
        NETHER_KIEM:
          model: "kiembay_nether"
  # Buff TuVi theo phi kiếm đang trang bị.
  tuvi-buffs:
    enabled: true
    slot: fly_sword
    weather-speed:
      include-rain: true
      include-thunder: true
      interval-reduction-percent: 25.0
    auto-tu-luyen:
      interval-ticks: 100
      actionbar:
        enabled: true
        format: "&8[&cU Minh Huyết Kiếm&8] &7Tự luyện: &a+{points} Tu Vi"
    swords:
      FLY_SWORD:
        THANH_PHONG_KIEM:
          tuvi-bonus-percent: 50.0
        DINH_BA_KIEM:
          tuvi-bonus-percent: 75.0
          weather-speed:
            enabled: true
            interval-reduction-percent: 25.0
        HA_CAM_KIEM:
          tuvi-bonus-percent: 100.0
          completion-bonus-percent: 30.0
        NETHER_KIEM:
          tuvi-bonus-percent: 150.0
          auto-tu-luyen:
            enabled: true
  # Tự bật quyền bay khi player vào world được phép, không cần gõ /fly lại.
  auto-flight:
    enabled: true
    # Để [] hoặc ["*"] nếu muốn mọi world đều tự bật bay.
    worlds:
      - SuperiorWorld
    require-permission: false
    permission: "tutiencore.flysword"
    # Rời world không nằm trong list thì tắt allowFlight để tránh bay lạc world.
    disable-outside-world: true
  # Khi player nhận damage sẽ bị tắt bay và khoá /fly trong một khoảng thời gian.
  combat-lock:
    enabled: true
    duration-seconds: 20
    disable-flying: true
    disable-allow-flight: true
    block-fly-command: true
    block-toggle-flight: true
    enforce-flight-state: true
    toggle-message-cooldown-ticks: 20
    command-labels:
      - fly
      - essentials:fly
      - cmi:fly
    messages:
      damaged: "&cBạn vừa nhận sát thương, không thể bay trong &e{seconds}s&c."
      pvp-damaged: "&cBạn vừa bị &e{attacker} &ctấn công, kiếm bay bị tắt trong &e{seconds}s&c."
      locked-command: "&cBạn đang bị khoá bay, chờ &e{seconds}s &cđể /fly lại."
  evolution:
    enabled: true
    default-level: 1
    info:
      - "&6Kiếm Bay &8| &fCấp: &e%level%"
      - "&7Model hiện tại: &f%model%"
      - "&7Model cấp sau: &e%next_model%"
      - "&7Linh thạch cần: &e%vault_cost%"
      - "&7Cổ thạch cần: &d%playerpoints_cost%"
      - "&7Nguyên liệu: &f%materials%"
      - "&e/ttc flysword evolve &7để tiến hoá."
    format:
      max-level: "Đã tối đa"
      no-materials: "Không cần"
    messages:
      disabled: "&cTiến hoá kiếm bay đang tắt."
      no-permission: "&cBạn không có quyền tiến hoá kiếm bay."
      max-level: "&cKiếm bay đã đạt cấp tối đa."
      not-enough-header: "&cBạn chưa đủ điều kiện tiến hoá kiếm bay:"
      not-enough-line: "&8- &7%reason%"
      missing-money: "Thiếu %amount% Linh thạch"
      missing-playerpoints: "Thiếu %amount% Cổ thạch"
      missing-material: "Thiếu %amount%x %type%:%id%"
      not-enough-money: "&cKhông thể trừ Linh thạch."
      not-enough-playerpoints: "&cKhông thể trừ Cổ thạch."
      material-take-failed: "&cKhông thể trừ nguyên liệu, vui lòng thử lại."
      success: "&aKiếm bay đã tiến hoá lên cấp &e%level%&a. Model: &b%model%"
    levels:
      1:
        model: "kiembay"
      2:
        model: "kiembay_2"
        vault-cost: 100000
        playerpoints-cost: 100
        materials:
          - type: MATERIAL
            id: LINH_THACH_KIEM_BAY
            amount: 8
      3:
        model: "kiembay_3"
        vault-cost: 300000
        playerpoints-cost: 300
        materials:
          - type: MATERIAL
            id: LINH_THACH_KIEM_BAY
            amount: 16
          - type: MATERIAL
            id: TINH_HOA_KIEM_BAY
            amount: 4

# Model hiện lên khi đột phá thành công
# Để trống "" nếu không có ModelEngine
breakthrough:
  # Bật/tắt model đột phá (true/false)
  enabled: true
  # PlaceholderAPI placeholder dùng làm Thực Lực khi /dotpha đại cảnh giới.
  # Để trống sẽ chặn các cảnh giới có thuc-luc-required > 0 cho tới khi cấu hình đúng.
  thuc-luc-placeholder: ""
  # Khi đột phá Đại Cảnh Giới, người chơi trong bán kính này cũng bị sét đánh.
  # damage-multiplier là tỉ lệ damage so với người đang đột phá.
  nearby-lightning:
    enabled: true
    radius: 20.0
    damage-multiplier: 0.25
  # Sound config cho luồng đột phá. Đặt sound: "NONE" để tắt riêng từng sound.
  # Hỗ trợ cả Bukkit Sound enum và custom sound từ resource pack, vd: "minecraft:entity.lightning_bolt.thunder"
  # hoặc "yourpack:breakthrough_charge".
  sounds:
    start-initiation:
      sound: "BLOCK_BEACON_ACTIVATE"
      category: MASTER
      volume: 1.5
      pitch: 0.8
    countdown-thunder:
      sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
      category: WEATHER
      volume: 2.0
      pitch: 0.5
    energy-charge:
      sound: "ENTITY_ENDER_DRAGON_FLAP"
      category: MASTER
      volume: 1.5
      pitch: 0.5
    lightning-main:
      sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
      category: WEATHER
      volume: 3.0
      pitch: 0.8
    lightning-impact:
      sound: "ENTITY_LIGHTNING_BOLT_IMPACT"
      category: WEATHER
      volume: 2.0
      pitch: 0.6
    lightning-rumble:
      sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
      category: WEATHER
      volume: 4.0
      pitch: 0.4
    major-success-primary:
      sound: "UI_TOAST_CHALLENGE_COMPLETE"
      category: MASTER
      volume: 3.0
      pitch: 1.0
    major-success-secondary:
      sound: "ENTITY_ENDER_DRAGON_GROWL"
      category: MASTER
      volume: 2.0
      pitch: 1.5
    major-success-explosion:
      sound: "ENTITY_GENERIC_EXPLODE"
      category: MASTER
      volume: 1.5
      pitch: 0.5
    sub-success:
      sound: "ENTITY_PLAYER_LEVELUP"
      category: MASTER
      volume: 2.0
      pitch: 1.5
    model-return:
      sound: "ENTITY_PLAYER_LEVELUP"
      category: MASTER
      volume: 2.0
      pitch: 1.2
    success-shockwave:
      sound: "ENTITY_FIREWORK_ROCKET_BLAST"
      category: MASTER
      volume: 1.5
      pitch: 0.5
  # MythicMobs mob chạy từ lúc bắt đầu và trong suốt quá trình đột phá.
  # Mob tự gắn ModelEngine model và chạy state "spawn", không dùng idle.
  active-animation: "spawn"
  active-mobs:
    - "TuTienCore_Dien1_Spawn"
    - "TuTienCore_Rong2_Spawn"
  # Model hiện khi đột phá ĐẠI CẢNH GIỚI thành công.
  # Để [] nếu chỉ muốn dùng active-mobs trong suốt quá trình đột phá.
  major-success-models: []
  # Model hiện khi đột phá TẦNG NHỎ thành công.
  # Để [] nếu chỉ muốn dùng active-mobs trong suốt quá trình đột phá.
  sub-success-models: []
  # Thời gian hiển thị model (giây) 
  model-duration: 5

# ==========================================
# HIỆU ỨNG TIA SÉT ĐỘT PHÁ (Lightning Storm)
# ==========================================
# Cấu hình số lượng tia sét VISUAL (không gây damage)
# Tạo hiệu ứng bão sét hoành tráng khi đột phá
lightning-storm:
  # Tốc độ bão sét visual.
  # Mỗi bao nhiêu tick thì spawn 1 đợt sét VISUAL (không gây damage)
  # Giá trị nhỏ = bão sét dày đặc hơn. VD: 3 = rất nhanh, 10 = chậm hơn
  storm-interval: 6
  # Sét ambient liên tục (visual only, tạo bầu không khí)
  storm-bolts-min: 2
  storm-bolts-max: 5
  # Sét visual mỗi lần damaging bolt (rải khắp 40x40)
  visual-bolts-min: 3
  visual-bolts-max: 8
  # Sét gần player (visual only, tạo cảm giác nguy hiểm)
  close-bolts-min: 1
  close-bolts-max: 2

  # ── SÉT SAU THÀNH CÔNG ──
  # Sét tiếp tục đánh trong lúc animation "actived" chạy
  success-storm-continue: true
  # Mỗi bao nhiêu tick đánh 1 lần (5 tick = 0.25 giây)
  success-storm-interval: 8
  # Số tia sét visual mỗi lần trong lúc success animation
  success-storm-bolts: 4
