  enabled: true
  type: mysql
  mysql:
    host: "185.207.166.124"
    port: 1032
    database: "s11652_tutiencore_trangbi"
    username: "u11652_wVKIMDhVDi"
    password: "^mVpCoOL=Tl75xaL.SdAa54."
