name: TuTienCore
version: '${project.version}'
main: com.turtle.tutiencore.TuTienCorePlugin
api-version: '1.21'
depend: [TurtleCore, ProtocolLib, packetevents]
softdepend: [PlaceholderAPI, Vault, PlayerPoints, LuckPerms, ModelEngine, MythicMobs, MMOCore, FancyHolograms, WorldGuard, SuperiorSkyblock2, TurtleIsland, TuTienLevel]
loadbefore: [BetterteamsAddon, MMOItems]
description: Cơ chế ngồi thiền tu luyện và hiệu ứng hạt Tu Tiên

commands:
  ttc:
    description: Lệnh chính TuTienCore
    usage: /ttc
  tuluyen:
    description: Vào trạng thái ngồi thiền tu luyện
    usage: /tuluyen
    permission: tutiencore.use
  dotpha:
    description: Mở menu đột phá cảnh giới (Thiên Lôi Kiếp)
    usage: /dotpha
    permission: tutiencore.use
  canhgioi:
    description: Mở menu cảnh giới và quản lý cảnh giới admin
    usage: /canhgioi
    permission: tutiencore.use
  tuvi:
    description: Quản lý Tu Vi người chơi
    usage: /tuvi set/add/take/reset/resetall <player> [amount]
    permission: tutiencore.admin
  nhapthan:
    description: Mở menu hoặc cấp Nhập Thần cũ
    usage: /nhapthan [give <player> <type> <rarity>]
    permission: tutiencore.use
  luathan:
    description: Cấp Lửa Thần dạng vật phẩm thật
    usage: /luathan give <player> <type> <rarity>
    permission: tutiencore.use
  trangbi:
    description: Mở menu trang bị Tu Tiên
    usage: /trangbi
    permission: tutiencore.use
  rankup:
    description: Nâng cấp VIP rank bằng Cổ thạch
    usage: /rankup [rank]
    permission: tutiencore.rankup
  thauthi:
    description: Bật/tắt Thấu Thị để soi thông tin player đang nhìn
    usage: /thauthi
    permission: tutiencore.thauthi

permissions:
  tutiencore.use:
    description: Cho phép dùng /tuluyen và /dotpha
    default: true
  tutiencore.admin:
    description: Quyền admin TuTienCore
    default: op
  tutiencore.rankup:
    description: Cho phép dùng /rankup
    default: true
  tutiencore.thauthi:
    description: Cho phép dùng /thauthi
    default: false
  tutiencore.nhapthan.give:
    description: Cho phép cấp Nhập Thần cũ cho người chơi
    default: op
  tutiencore.luathan.give:
    description: Cho phép cấp stack vật phẩm Lửa Thần cho người chơi
    default: op
  tutiencore.tuluyen.vip:
    description: Cho phép tích Tu Vi offline và mở GUI nhận thưởng
    default: false
  tutiencore.afk.bypass:
    description: Bỏ qua kick AFK TuTienCore
    default: op
  tutiencore.vip.0:
    description: Hạng VIP TuTienCore 0
    default: false
  tutiencore.vip.1:
    description: Hạng VIP TuTienCore 1
    default: false
  tutiencore.vip.2:
    description: Hạng VIP TuTienCore 2
    default: false
  tutiencore.vip.3:
    description: Hạng VIP TuTienCore 3
    default: false
  tutiencore.vip.4:
    description: Hạng VIP TuTienCore 4
    default: false
  tutiencore.vip.5:
    description: Hạng VIP TuTienCore 5
    default: false
  tutiencore.vip.6:
    description: Hạng VIP TuTienCore 6
    default: false
  tutiencore.vip.7:
    description: Hạng VIP TuTienCore 7
    default: false
  tutiencore.vip.8:
    description: Hạng VIP TuTienCore 8
    default: false
  tutiencore.vip.9:
    description: Hạng VIP TuTienCore 9
    default: false
  tutiencore.vip.10:
    description: Hạng VIP TuTienCore 10
    default: false
