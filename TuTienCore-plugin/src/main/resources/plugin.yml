name: TuTienCore
version: '${project.version}'
main: com.turtle.tutiencore.TuTienCorePlugin
api-version: '1.21'
depend: [TurtleCore, ProtocolLib, packetevents]
softdepend: [PlaceholderAPI, Vault, PlayerPoints, LuckPerms, ModelEngine, MythicMobs, MMOCore, FancyHolograms, WorldGuard, SuperiorSkyblock2, TurtleIsland, TuTienLevel]
loadbefore: [BetterteamsAddon, MMOItems]
description: Tu Tien sitting mechanic and particles

commands:
  ttc:
    description: TuTienCore Main Command
    usage: /ttc
  tuluyen:
    description: Vao trang thai ngoi thien tu luyen
    usage: /tuluyen
    permission: tutiencore.use
  dotpha:
    description: Mo menu dot pha canh gioi (Thien Loi Kiep)
    usage: /dotpha
    permission: tutiencore.use
  canhgioi:
    description: Mo menu canh gioi va quan ly canh gioi admin
    usage: /canhgioi
    permission: tutiencore.use
  tuvi:
    description: Quan ly Tu Vi nguoi choi
    usage: /tuvi set/add/take/reset/resetall <player> [amount]
    permission: tutiencore.admin
  nhapthan:
    description: Mở menu hoặc cấp Nhập Thần cũ
    usage: /nhapthan [give <player> <type> <rarity>]
    permission: tutiencore.use
  luathan:
    description: Cấp Lửa Thần dạng vật phẩm thật
    usage: /luathan give <player> <type> <rarity>
    permission: tutiencore.use
  trangbi:
    description: Mo menu trang bi Tu Tien
    usage: /trangbi
    permission: tutiencore.use
  rankup:
    description: Nang cap VIP rank bang Co thach
    usage: /rankup [rank]
    permission: tutiencore.rankup

permissions:
  tutiencore.use:
    description: Allows using /tuluyen and /dotpha
    default: true
  tutiencore.admin:
    description: Admin permission for TuTienCore
    default: op
  tutiencore.rankup:
    description: Allows using /rankup
    default: true
  tutiencore.nhapthan.give:
    description: Allows granting legacy Nhap Than to players
    default: op
  tutiencore.luathan.give:
    description: Allows granting Lua Than item stacks to players
    default: op
  tutiencore.tuluyen.vip:
    description: Allows offline Tu Vi accumulation and claim GUI
    default: false
  tutiencore.afk.bypass:
    description: Bypass TuTienCore AFK kick
    default: op
  tutiencore.vip.0:
    description: TuTienCore VIP rank 0
    default: false
  tutiencore.vip.1:
    description: TuTienCore VIP rank 1
    default: false
  tutiencore.vip.2:
    description: TuTienCore VIP rank 2
    default: false
  tutiencore.vip.3:
    description: TuTienCore VIP rank 3
    default: false
  tutiencore.vip.4:
    description: TuTienCore VIP rank 4
    default: false
  tutiencore.vip.5:
    description: TuTienCore VIP rank 5
    default: false
  tutiencore.vip.6:
    description: TuTienCore VIP rank 6
    default: false
  tutiencore.vip.7:
    description: TuTienCore VIP rank 7
    default: false
  tutiencore.vip.8:
    description: TuTienCore VIP rank 8
    default: false
  tutiencore.vip.9:
    description: TuTienCore VIP rank 9
    default: false
  tutiencore.vip.10:
    description: TuTienCore VIP rank 10
    default: false
