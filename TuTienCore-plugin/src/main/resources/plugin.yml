name: TuTienCore
version: '${project.version}'
main: com.turtle.tutiencore.TuTienCorePlugin
api-version: '1.21'
depend: [TurtleCore, ProtocolLib]
softdepend: [PlaceholderAPI, Vault, PlayerPoints, ModelEngine, MythicMobs, MMOItems, MMOCore, FancyHolograms, WorldGuard, BetterteamsAddon]
description: Tu Tien sitting mechanic and particles

commands:
  ttc:
    description: TuTienCore Main Command
    usage: /ttc
  tuluyen:
    description: Vao trang thai ngoi thien tu luyen
    usage: /tuluyen
    permission: tutiencore.use
  dotpha:
    description: Mo menu dot pha canh gioi (Thien Loi Kiep)
    usage: /dotpha
    permission: tutiencore.use
  canhgioi:
    description: Mo menu canh gioi va quan ly canh gioi admin
    usage: /canhgioi
    permission: tutiencore.use
    aliases: [realm]
  tuvi:
    description: Quan ly Tu Vi nguoi choi
    usage: /tuvi set/add/take/reset/resetall <player> [amount]
    permission: tutiencore.admin

permissions:
  tutiencore.use:
    description: Allows using /tuluyen and /dotpha
    default: true
  tutiencore.admin:
    description: Admin permission for TuTienCore
    default: op
  tutiencore.tuluyen.vip:
    description: Allows offline Tu Vi accumulation and claim GUI
    default: false
