# Cấu hình hệ thống Lửa Thần.
# File này được copy ra /plugins/TuTienCore/nhapthan/infusion.yml khi plugin chạy lần đầu.
# Người chơi phải cầm item Lửa Thần thật ở main-hand/off-hand để nhận buff.
# Admin cấp item bằng: /luathan give <player> <type> <rarity>
# Drop thêm khi /tuluyen được roll một lần theo mỗi interval nhận Tu Vi.
# tu-vi-bonus trong rarities là % Tu Vi cộng thêm theo độ hiếm.
# tu-vi-bonus trong types là % Tu Vi riêng của từng Lửa, được nhân với multiplier của rarity.
# material của mỗi Lửa dùng Music Disc riêng; disc thường cho Lửa cơ bản, disc hiếm hơn cho Lửa cấp cao.

gui:
  title: "&6&lLửa Thần"
  border-material: "PURPLE_STAINED_GLASS_PANE"
  item-equipped:
    material: "NETHER_STAR"
    name: "&6Lửa Thần Đang Cầm"
    lore:
      - "&7Cầm Lửa Thần ở main-hand/off-hand để kích hoạt buff."
  item-storage:
    material: "BOOK"
    name: "&fLửa Thần"
    lore:
      - "&7Click để trang bị."
  item-prev-page:
    material: "ARROW"
    name: "&eTrang trước"
    lore:
      - "&7Click để quay lại."
  item-next-page:
    material: "ARROW"
    name: "&eTrang sau"
    lore:
      - "&7Click để tiếp tục."
  item-close:
    material: "BARRIER"
    name: "&cĐóng"
    lore:
      - "&7Đóng menu."
  item-info:
    material: "BOOK"
    name: "&6Thông tin Lửa Thần"
    lore:
      - "&7Quản lý Lửa Thần của bạn."

messages:
  no-permission: "&cBạn không có quyền sử dụng lệnh này!"
  player-only: "&cLệnh này chỉ dùng được cho người chơi!"
  give-usage: "&eSử dụng: /luathan give <player> <type> <rarity>"
  give-player-not-found: "&cKhông tìm thấy người chơi (online, uuid, hoặc tên đã cache)."
  give-invalid-type: "&cLoại Lửa Thần không hợp lệ: &e{type}"
  give-invalid-rarity: "&cĐộ hiếm không hợp lệ: &e{rarity}"
  give-success: "&aĐã cấp Lửa Thần &e{type} &7({rarity_color}{rarity_display}&7) &acho &e{player}&a."
  give-failed: "&cCấp Lửa Thần thất bại."
  inventory-full: "&cKho Lửa Thần đã đầy (tối đa 270)."
  item-no-longer-available: "&cVật phẩm đã thay đổi. Hãy mở lại menu."
  equip-failed: "&cTrang bị thất bại. Dữ liệu đã được hoàn nguyên."
  unequip-failed: "&cTháo Lửa Thần thất bại."
  inventory-recovered-empty: "&eDữ liệu kho không hợp lệ và đã được khôi phục rỗng."
  feature-disabled: "&cHệ thống Lửa Thần đang tắt do lỗi cấu hình."

rarities:
  COMMON:
    display-name: "Phàm Hỏa"
    color: "&7"
    multiplier: 1.0
    tu-vi-bonus: 2.0
  RARE:
    display-name: "Linh Hỏa"
    color: "&9"
    multiplier: 1.2
    tu-vi-bonus: 5.0
  EPIC:
    display-name: "Huyền Hỏa"
    color: "&5"
    multiplier: 1.5
    tu-vi-bonus: 10.0
  LEGENDARY:
    display-name: "Thiên Hỏa"
    color: "&6"
    multiplier: 1.9
    tu-vi-bonus: 15.0
  MYTHIC:
    display-name: "Hồng Mông Thần Hỏa"
    color: "&d"
    multiplier: 2.5
    tu-vi-bonus: 25.0

