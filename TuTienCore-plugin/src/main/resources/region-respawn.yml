# Region Respawn settings.
# Khi player chết/respawn trong region được config, đổi điểm hồi sinh về tọa độ riêng.
# Hỗ trợ cả TuTien zone id và WorldGuard region id.

enabled: true

# death = check region tại vị trí player chết.
# respawn = check region tại vị trí respawn mặc định của server.
check-location: death

debug: false

regions:
  # Đổi "example_region" thành id region/zone thật.
  example_region:
    # Có thể bỏ dòng region nếu key bên trên chính là id region.
    region: "example_region"
    world: "world"
    x: 0.5
    y: 80.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

death-tips:
  # Khi player chết bởi mob và world bật gamerule doImmediateRespawn,
  # plugin sẽ cho player xem lại vị trí chết trong spectator rồi hiện tips riêng.
  enabled: true
  # false = /kill hoặc chết vì nguyên nhân khác cũng chạy death tips, tiện để test.
  # true = chỉ chạy khi player chết bởi mob/projectile của mob.
  mob-only: false
  debug: false
  require-immediate-respawn: true
  respawn-delay-ticks: 2
  # Fallback nếu server immediate respawn không bắn PlayerRespawnEvent đúng timing.
  fallback-delay-ticks: 6
  # Re-apply spectator target sau vài tick để chống plugin khác đổi gamemode sau respawn.
  # -1 = tắt re-apply.
  spectator-reapply-delay-ticks: 2
  # Sau delay trên, tiếp tục khóa camera mỗi bao nhiêu tick trong suốt thời gian xem tips.
  spectator-reapply-interval-ticks: 2
  # true = nếu plugin khác kéo player quá xa camera target, kéo lại gần target trước khi spectate.
  teleport-to-anchor-before-spectate: true
  # Cách target quá số block này thì teleport lại trước khi set spectator target.
  teleport-to-anchor-distance: 8.0
  # Force lock trong lúc xem death tips: chặn plugin khác đổi gamemode/teleport làm mất spectator.
  force-spectator:
    enabled: true
    cancel-gamemode-change: true
    cancel-teleport: true
    # false = không bám camera vào entity nữa, chỉ khóa spectator tại tọa độ chết.
    # true = vẫn thử set spectator target vào Villager anchor.
    use-anchor-target: false
    lock-position: true
  cinematic:
    # true = camera quay kiểu góc nhìn thứ 3 quanh vị trí chết.
    enabled: true
    # DISPLAY = dùng TextDisplay làm camera target, có teleport-duration/interpolation-duration.
    # PLAYER = không bám entity, teleport trực tiếp camera player quanh vị trí chết.
    mode: DISPLAY
    radius: 4.5
    height: 2.0
    look-at-y-offset: 1.0
    # 180 = bắt đầu sau lưng hướng nhìn lúc chết, sau đó quay quanh điểm chết.
    start-angle-degrees: 180.0
    degrees-per-second: 55.0
    step-ticks: 2
    teleport-duration: 2
    interpolation-duration: 2
    # Client đôi khi bỏ qua packet spectator target ngay tick đầu sau respawn.
    # Các mốc này sẽ clear target rồi set lại Display, giống hiệu ứng bấm shift refresh.
    target-retry-ticks: [1, 3, 6, 10]
  death-head:
    # true = tạo một đầu player ảo bằng ItemDisplay tại vị trí chết, dùng skin của player.
    enabled: true
    y-offset: 0.25
    scale: 0.85
    light: 15
    billboard: FIXED
    transform: HEAD
  cinematic-text:
    # TextDisplay rieng cua TuTienCore, bay truoc camera player nhu title/subtitle.
    enabled: true
    title: "&c&lTrang bi chua du manh"
    subtitle: "&7%tip%"
    duration-ticks: 80
    update-interval-ticks: 2
    distance: 2.4
    y-offset: -0.05
    rise-distance: 0.55
    start-scale: 0.9
    end-scale: 0.55
    start-opacity: 230
    end-opacity: 0
    teleport-duration: 2
    interpolation-duration: 2
    line-width: 260
    view-range: 8.0
    shadow: true
    see-through: true
    background-alpha: 0
  view-duration-ticks: 80
  restore-gamemode: true
  restore-to-respawn-location: true
  anchor:
    # Camera target là Villager tàng hình/silent/no-ai để spectator bám ổn hơn ArmorStand.
    y-offset: 0.0
  title:
    enabled: true
    title: "&c&lTrang bị chưa đủ mạnh"
    subtitle: "&7%tip%"
    fade-in: 5
    stay: 70
    fade-out: 15
  sound:
    enabled: true
    # Hỗ trợ Bukkit sound hoặc custom sound resourcepack, ví dụ: tutiencore:death_tip
    name: "ENTITY_WITHER_SPAWN"
    category: MASTER
    volume: 0.55
    pitch: 0.75
  message:
    enabled: false
    lines:
      - "&cBạn vừa bị &f%mob% &chạ gục."
      - "&7%tip%"
  tips:
    - "&7Trang bị của bạn còn yếu, hãy luyện khí hoặc nâng phẩm trước khi quay lại."
    - "&7Thử nâng vũ khí, giáp và chọn khu vực quái phù hợp cảnh giới."
    - "&7Nếu quái đánh quá đau, hãy kiếm set phòng thủ hoặc tăng máu trước."
    - "&7Luyện thêm trang bị ở Luyện Khí Các sẽ giúp sống sót tốt hơn."
