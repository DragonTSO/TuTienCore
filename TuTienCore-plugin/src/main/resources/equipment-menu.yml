slots:
  accessory:
    slot: 20
    display-name: "Trang Sức"
    # false = lấy chỉ số trực tiếp từ MMOItems trên item đã đặt vào slot.
    # true = cộng thêm stats config bên dưới nếu bạn muốn bonus riêng.
    use-config-stats: false
    accepted-types:
      - ACCESSORY
    empty:
      material: AMETHYST_SHARD
      name: "&dTrang Sức"
      lore:
        - "&7Đặt item MMOItems type &dACCESSORY"
        - "&7vào đây để nhận chỉ số."
  fly_sword:
    slot: 22
    display-name: "Phi Kiếm"
    # Item phi kiếm quyết định model fly-sword và cộng stat MMOItems khi trang bị.
    use-config-stats: false
    accepted-types:
      - FLY_SWORD
    empty:
      material: DIAMOND_SWORD
      name: "&bPhi Kiếm"
      lore:
        - "&7Đặt item có loại &fPhi Kiếm"
        - "&7vào đây để đổi kiếm bay và nhận chỉ số."
  dan_duoc:
    slot: 24
    display-name: "Đan Dược"
    # false = lấy chỉ số trực tiếp từ MMOItems trên item đã đặt vào slot.
    # true = cộng thêm stats config bên dưới nếu bạn muốn bonus riêng.
    use-config-stats: false
    accepted-types:
      - DAN_DUOC
    empty:
      material: HONEY_BOTTLE
      name: "&6Đan Dược"
      lore:
        - "&7Đặt item MMOItems type &6DAN_DUOC"
        - "&7vào đây để nhận chỉ số."
    duration:
      enabled: true
      # Ưu tiên lấy stat MMOItems này trên item. Đơn vị: giây.
      stat: DAN_DUOC_DURATION
      # Bonus system stat hoạt động khi DAN_DUOC đang được trang bị:
      # - DAN_DUOC_TUVI_BONUS: cộng % Tu Vi từ /tuluyen.
      # - DAN_DUOC_MYTHIC_MONEY_BONUS: cộng % Linh thạch Vault từ MythicMobs money drop.
      # - DAN_DUOC_FORGE_LUCK_BONUS: cộng % luck cho TuTienForge /luyenkhi.
      # Nếu item không có stat DAN_DUOC_DURATION thì dùng default này.
      # Hỗ trợ: 30s, 5m, 2h, 1d, hoặc ghép như 1h30m.
      default: 1h
      # true = ghi lore thời gian vào chính item; tháo ra sẽ giữ thời gian còn lại.
      write-to-item-lore: true
      consume-when-expired: true
      lore:
        - ""
        - "&7Hiệu lực: &e%remaining% &8/ &f%duration%"

