enabled: true

duration:
  # Lưu thời gian còn lại xuống equipment-data.yml mỗi bao nhiêu giây.
  save-interval-seconds: 30

consumable:
  enabled: true
  accepted-types:
    - DAN_DUOC_CONSUMABLE
  # Để trống = chỉ check theo MMOItems type. Nếu muốn hỗ trợ flag stat cũ,
  # điền stat id vào đây và item phải có stat đó > 0.
  flag-stat: ""
  duration-stat: DAN_DUOC_DURATION
  default-duration: 5m
  consume-amount: 1

