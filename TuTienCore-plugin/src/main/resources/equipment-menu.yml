slots:
  accessory:
    slot: 20
    # false = lay chi so truc tiep tu MMOItems tren item da dat vao slot.
    # true = cong them stats config ben duoi neu ban muon bonus rieng.
    use-config-stats: false
    accepted-types:
      - ACCESSORY
    empty:
      material: AMETHYST_SHARD
      name: "&dTrang Suc"
      lore:
        - "&7Dat item MMOItems type &dACCESSORY"
        - "&7vao day de nhan chi so."
  dan_duoc:
    slot: 24
    # false = lay chi so truc tiep tu MMOItems tren item da dat vao slot.
    # true = cong them stats config ben duoi neu ban muon bonus rieng.
    use-config-stats: false
    accepted-types:
      - DAN_DUOC
    empty:
      material: HONEY_BOTTLE
      name: "&6Dan Duoc"
      lore:
        - "&7Dat item MMOItems type &6DAN_DUOC"
        - "&7vao day de nhan chi so."
    duration:
      enabled: true
      # Uu tien lay stat MMOItems nay tren item. Don vi: giay.
      stat: DAN_DUOC_DURATION
      # Bonus system stat hoat dong khi DAN_DUOC dang duoc trang bi:
      # - DAN_DUOC_TUVI_BONUS: cong % Tu Vi tu /tuluyen.
      # - DAN_DUOC_MYTHIC_MONEY_BONUS: cong % Linh thach Vault tu MythicMobs money drop.
      # - DAN_DUOC_FORGE_LUCK_BONUS: cong % luck cho TuTienForge /luyenkhi.
      # Neu item khong co stat DAN_DUOC_DURATION thi dung default nay.
      # Ho tro: 30s, 5m, 2h, 1d, hoac ghep nhu 1h30m.
      default: 1h
      # true = ghi lore thoi gian vao chinh item; thao ra se giu thoi gian con lai.
      write-to-item-lore: true
      consume-when-expired: true
      lore:
        - ""
        - "&7Hieu luc: &e%remaining% &8/ &f%duration%"

