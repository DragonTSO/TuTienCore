  accepted-types:
    - DAN_DUOC
  # Item DAN_DUOC nao co stat nay > 0 se duoc right-click de dung mot lan.
  flag-stat: DAN_DUOC_CONSUMABLE
  duration-stat: DAN_DUOC_DURATION
  default-duration: 5m
  consume-amount: 1

