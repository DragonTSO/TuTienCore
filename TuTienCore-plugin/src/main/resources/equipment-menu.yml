enabled: true

duration:
  # Luu thoi gian con lai xuong equipment-data.yml moi bao nhieu giay.
  save-interval-seconds: 30

consumable:
  enabled: true
  accepted-types:
    - DAN_DUOC_CONSUMABLE
  # De trong = chi check theo MMOItems type. Neu muon ho tro flag stat cu,
  # dien stat id vao day va item phai co stat do > 0.
  flag-stat: ""
  duration-stat: DAN_DUOC_DURATION
  default-duration: 5m
  consume-amount: 1

