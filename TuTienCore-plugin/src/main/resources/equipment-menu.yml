      - " &b⌖ &fChí mạng: &f%stat_CRITICAL_STRIKE_CHANCE%"
      - " &d✹ &fSát thương chí mạng: &f%stat_CRITICAL_STRIKE_POWER%"
      - ""
      - "&8ᴄʜỉ số sứᴄ ᴋʜᴏẻ:"
      - " &a❤ &fMáu tối đa: &f%stat_MAX_HEALTH%"
      - " &3⛨ &fPhòng thủ: &f%stat_DEFENSE%"
      - " &2❖ &fGiảm sát thương: &f%stat_DAMAGE_REDUCTION%"
      - ""
      - "&8ᴄʜỉ số ʟɪɴʜ ʟựᴄ:"
      - " &9✦ &fLinh lực tối đa: &f%stat_MAX_MANA%"
      - " &b✧ &fHồi linh lực: &f%stat_MANA_REGENERATION%"

  upgrade-title: "&8Tiến Hoá"
  upgrade-size: 27
  upgrade-slots:
    source: 11
    result: 15
    confirm: 13
  upgrade-preview:
    material: EMERALD
    name: "&e%to_name%"
    # custom-model-data: 1003  # chi ap dung khi khong tao duoc item MMOItems that
    append-lore:
      - ""
      - "&7Linh thạch: &e%cost%"
      - "&7Level yêu cầu: &a%required_level%"
      - "&7Cảnh giới cần: &b%required_realm%"
    lore:
      - "&7Item nhan qua command cau hinh."
      - ""
      - "&7Linh thạch: &e%cost%"
      - "&7Cấp yêu cầu: &a%required_level%"
      - "&7Cảnh giới: &b%required_realm%"
  upgrade-confirm:
    material: EMERALD
    name: "&aTiến Hoá"
    # custom-model-data: 1004
    lore:
      - "&7Item hiện tại: &f%from_name%"
      - "&7Sau tiến hoá: &e%to_name%"
      - ""
      - "&7Linh thạch: &e%cost%"
      - "&7Cấp yêu cầu: &a%required_level%"
      - "&7Cảnh giới: &b%required_realm%"
      - ""
      - "&aClick để xác nhận."

slots:
  accessory:
    slot: 20
    display-name: "Trang Sức"
    # false = lay chi so truc tiep tu MMOItems tren item da dat vao slot.
    # true = cong them stats config ben duoi neu ban muon bonus rieng.
    use-config-stats: false
    accepted-types:
      - ACCESSORY
    empty:
      material: AMETHYST_SHARD
      name: "&dTrang Sức"
      # custom-model-data: 2001  # icon o trong cho slot nay (tuy chon)
      lore:
        - "&7Đặt item có loại &fTrang sức"
        - "&7vào đây để nhận chỉ số."
  fly_sword:
    slot: 22
    display-name: "Phi Kiếm"
    # Item phi kiếm quyết định model fly-sword và cộng stat MMOItems khi trang bị.
    use-config-stats: false
    accepted-types:
      - FLY_SWORD
    empty:
      material: DIAMOND_SWORD
      name: "&bPhi Kiếm"
      lore:
        - "&7Đặt item có loại &fPhi Kiếm"
        - "&7vào đây để đổi kiếm bay và nhận chỉ số."
  dan_duoc:
    slot: 24
    display-name: "Đan Dược"
    # false = lay chi so truc tiep tu MMOItems tren item da dat vao slot.
    # true = cong them stats config ben duoi neu ban muon bonus rieng.
    use-config-stats: false
    accepted-types:
      - DAN_DUOC
    empty:
      material: HONEY_BOTTLE
      name: "&6Đan Dược"
      lore:
        - "&7Đặt item có loại &fĐan dược"
        - "&7vào đây để nhận chỉ số."
    duration:
      enabled: true
      # Uu tien lay stat MMOItems nay tren item. Don vi: giay.
      stat: DAN_DUOC_DURATION
      # Bonus system stat hoat dong khi DAN_DUOC dang duoc trang bi:
      # - DAN_DUOC_TUVI_BONUS: cong % Tu Vi tu /tuluyen.
      # - DAN_DUOC_MYTHIC_MONEY_BONUS: cong % Linh thach Vault tu MythicMobs money drop.
      # - DAN_DUOC_FORGE_LUCK_BONUS: cong % luck cho TuTienForge /luyenkhi.
      # Neu item khong co stat DAN_DUOC_DURATION thi dung default nay.
      # Ho tro: 30s, 5m, 2h, 1d, hoac ghep nhu 1h30m.
      default: 1h
      # true = ghi lore thoi gian vao chinh item; thao ra se giu thoi gian con lai.
      write-to-item-lore: true
      consume-when-expired: true
      lore:
        - ""
        - "&7Hiệu Lực: &e%remaining% &8/ &f%duration%"

