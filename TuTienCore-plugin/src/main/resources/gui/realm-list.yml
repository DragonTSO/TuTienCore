      - "&8đã độᴛ ᴘʜá"
      - ""
      - "&7Đại Giới: {realm_tier_color}{realm_tier}"
      - "&7Tu Vi yêu cầu: &a{realm_tuvi} &a✔"
      - "&7Thực Lực yêu cầu: &e{realm_thuc_luc}"
      - "&7Đột Phá Đan: &6{realm_dot_pha_dan} cái"
      - "&8━━━━━━━━━━━━━━━━━━━━━"
      - "&2Bạn đã vượt qua cảnh giới này."

  future:
    material: RED_STAINED_GLASS_PANE
    name: "&c✖ {realm_name}"
    glow: false
    lore:
      - "&8━━━━━━━━━━━━━━━━━━━━━"
      - "&8ᴄʜưᴀ độᴛ ᴘʜá"
