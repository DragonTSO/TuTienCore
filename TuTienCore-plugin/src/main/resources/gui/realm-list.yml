    - "&2■ &7Đã đột phá"
    - "&a■ &7Cảnh giới hiện tại"
    - "&c■ &7Chưa đột phá"
    - ""
    - "&7Hiện tại: %tutien_canhgioi_full%"
    - "&7Tầng nhỏ: &e%tutien_canhgioi_tang%"
    - "&8━━━━━━━━━━━━━━━━━━━━━"

