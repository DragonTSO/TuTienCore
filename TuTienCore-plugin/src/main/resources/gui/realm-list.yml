  material: PLAYER_HEAD
  name: "&e&l%player_name% &7— Hồ Sơ Tu Luyện"
  lore:
    - "&8━━━━━━━━━━━━━━━━━━━━━"
    - "&8ᴛʜôɴɢ ᴛɪɴ"
