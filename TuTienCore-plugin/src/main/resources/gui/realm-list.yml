  slot: 4
  material: NETHER_STAR
  name: "&d&l✦ Lộ Trình Tu Tiên ✦"
  lore:
    - "&8━━━━━━━━━━━━━━━━━━━━━"
    - "&7Theo dõi các mốc cảnh giới chính"
