# /thauthi: bật Thấu Thị để soi thông tin player đang nhìn.
# TextDisplay được ẩn mặc định và chỉ show cho người đang bật thấu thị.
thauthi:
  enabled: true
  permission: "tutiencore.thauthi"
  require-permission-each-tick: true
  max-distance: 50.0
  ray-size: 0.35
  require-line-of-sight: true
  ignore-spectator: true
  update-interval-ticks: 2
  head-mount:
    enabled: true
    # 0 = luon mount len dau viewer nhu TargetTracker.
    distance: 0.0
    # Toa do local khi dang mount tren dau viewer.
    x-offset: -1.15
    y-offset: -0.35
    z-offset: -2.5
    scale: 0.65
    force-transform-refresh: true
    refresh-epsilon: 0.0005
    teleport-duration: 1
    interpolation-duration: 1
    interpolation-delay: 0
  scale:
    default: 1.0
    distance-based: true
    # Cang lai gan target, text cang nho lai.
    min-distance: 1.5
    max-distance: 50.0
    min: 1
    max: 50
  spawn-animation:
    enabled: true
    # Text bat dau thap hon vi tri that roi truot len.
    from-y-offset: -0.45
    start-delay-ticks: 1
    fade-in-ticks: 10
    rise-duration: 8
    interpolation-duration: 10
  teleport-duration: 1
  interpolation-duration: 1
  interpolation-delay: 0
  fade-out-ticks: 8
  # Mat target thi text truot nguoc xuong duoi roi moi bien mat.
  fade-out-y-offset: -0.45
  fade-out-teleport-duration: 2
  fade-out-interpolation-duration: 2
  fade-out-opacity: 0
  opacity: 230
  view-range: 24.0
  auto-view-range: true
  view-range-padding: 4.0
  line-width: 190
  shadow: true
  see-through: false
  default-background: false
  level-unavailable: "N/A"
  background-color:
    a: 0
    r: 0
    g: 0
    b: 0
  lines:
    - "&6&lThấu Thị &8» &f{target}"
    - "&7Cảnh giới: &e{realm_full}"
    - "&7Level: &a{level} &8| &7Tu Vi: &b{tuvi_compact}"
  mythicmobs:
    enabled: true
    ray-size: 1.25
    unknown-damage: "???"
    assignments:
      enabled: true
      # Uu tien doc file SunshineHealthBars, sau do fallback ve folder TuTienCore.
      files:
        - "../SunshineHealthBars/mob_assignments.yml"
        - "mob_assignments.yml"
    lines:
      - "&6&lThấu Thị &8» &c{mob}"
      - "&7HP: &c{health}&8/&c{max_health}"
      - "&7Sát thương: &e{attack_damage}"
    mobs:
      SoiHoang:
        # Override name/lines rieng cho mob nay. Neu bo trong se lay name tu mob_assignments.yml.
        # name: "&7Soi hoang &8[&aMoc&8]"
        thauthi:
          lines:
            - "&6&lThau Thi &8» &c{mob}"
            - "&7ID: &f{mob_id}"
            - "&7HP: &c{health}&8/&c{max_health}"
            - "&7Sat thuong: &e{attack_damage}"
  messages:
    only-player: "&cChỉ player mới dùng được lệnh này."
    disabled: "&cThấu thị đang tắt."
    no-permission: "&cBạn không có quyền dùng Thấu Thị."
    on: "&aĐã bật Thấu Thị. Nhìn vào player để soi thông tin."
    off: "&cĐã tắt Thấu Thị."
  effects:
    enabled: true
    # Sound name co the la sound vanilla hoac custom resourcepack, vi du: "turtle:thauthi_on".
    toggle-on:
      sound:
        enabled: true
        name: "minecraft:sfx.thauthi"
        category: MASTER
        volume: 0.7
        pitch: 1.25
      particle:
        enabled: true
        type: END_ROD
        shape: EXPANDING_SPHERE
        anchor: FEET
        count: 14
        x-offset: 0.28
        y-offset: 0.18
        z-offset: 0.28
        speed: 0.02
        sphere:
          ticks: 7
          interval-ticks: 1
          points: 180
          point-count: 1
          point-offset: 0.0
          radius-start: 0.2
          radius-end: 20.0
          speed: 0.0
          smooth: true
    toggle-off:
      sound:
        enabled: true
        name: "minecraft:block.amethyst_block.hit"
        category: MASTER
        volume: 0.55
        pitch: 0.85
      particle:
        enabled: true
        type: SMOKE
        shape: EXPANDING_RING
        anchor: EYE
        count: 8
        x-offset: 0.18
        y-offset: 0.12
        z-offset: 0.18
        speed: 0.01
        ring:
          ticks: 4
          interval-ticks: 1
          points: 80
          point-count: 1
          point-offset: 0.0
          radius-start: 0.1
          radius-end: 20.0
          forward-offset: 0.75
          speed: 0.0
          smooth: true
    target-found:
      sound:
        enabled: true
        name: "minecraft:block.note_block.harp"
        category: MASTER
        volume: 0.55
        pitch: 1.6
      particle:
        enabled: false
        type: END_ROD
        shape: EXPANDING_RING
        anchor: EYE
        count: 10
        x-offset: 0.18
        y-offset: 0.12
        z-offset: 0.18
        speed: 0.035
        ring:
          ticks: 5
          interval-ticks: 1
          points: 96
          point-count: 1
          point-offset: 0.0
          radius-start: 0.08
          radius-end: 20.0
          forward-offset: 0.9
          speed: 0.0
          smooth: true
    target-lost:
      sound:
        enabled: true
        name: "minecraft:block.note_block.bass"
        category: MASTER
        volume: 0.45
        pitch: 0.7
      particle:
        enabled: true
        type: ASH
        shape: EXPANDING_RING
        anchor: EYE
        count: 8
        x-offset: 0.16
        y-offset: 0.1
        z-offset: 0.16
        speed: 0.01
        ring:
          ticks: 4
          interval-ticks: 1
          points: 80
          point-count: 1
          point-offset: 0.0
          radius-start: 0.08
          radius-end: 20.0
          forward-offset: 0.75
          speed: 0.0
          smooth: true
