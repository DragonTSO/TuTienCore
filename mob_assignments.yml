#====================================================#
#         SunshineHealthBars Mob Assignments         #
#====================================================#
#
# In this file, you assign a health bar style to each of your mobs.
# This works for both MythicMobs and regular vanilla Minecraft mobs.

# --- How to Configure ---
#
# 1. For MythicMobs:
#    Use the mob's internal name as the key (e.g., 'SkeletalKnight').
#
# 2. For Vanilla Mobs:
#    Use the official Minecraft mob name in ALL CAPS (e.g., ZOMBIE, SKELETON).

# --- Finding Bone Names for ModelEngine ---
#
# To anchor a health bar to a moving part of a custom model, you need the bone's name.
# 1. Make sure at least one of your custom mobs is spawned and loaded in the world.
# 2. Use the command: /sbinspect <model_id>
#    (Example: /sbinspect skeletal_knight)
# 3. The command will list all available bones for that model. Use one of these names
#    in the 'mount-bone' option below.

# --- Configuration Options ---
#
# name: (Optional) The name that will be displayed above the health bar.
#
# layout: (Required) The name of the layout file to use from the '/layouts/'
#         folder (without the .yml extension).
#
# vertical-offset: (Required) The final height of the health bar, measured from
#                  the mob's feet (or from the bone if 'mount-bone' is used).
#
# mount-bone: (Optional - For ModelEngine Only) Anchors the health bar directly to a
#             model's bone. This makes the bar follow animations perfectly.
#             Use the /sbinspect command to find available bone names.
#
# components: (Required) Defines which style files your layout components will use.
#   health_bar: The design file from the 'components/health_bars/' folder.
#   level_display: The design file from the 'components/level_displays/' folder.

#---------------------------------------------#
# --- ModelEngine & MythicMob Examples ---
#---------------------------------------------#
Dummy_Tutorial:
  # This mob's health bar will be attached directly to its 'head' bone.
  name: '&7Bù nhìn'
  layout: 'layout-vanilla-3'
  vertical-offset: 2.5
  mount-bone: 'head'
  components:
    health_bar: 'health-bar-sunshine'
    level_display: 'level-display-sunshine'
